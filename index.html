<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CSW24 Word Study</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CSW24">
<meta name="theme-color" content="#1f5c4a" id="themeColor">
<script>
// Paint the saved theme before anything else loads, so a reload (or the phone's top bar) doesn't flash the default green.
// applySettings() in the app script writes csw24:paint with the finished colours for light and dark.
try {
  const p = JSON.parse(localStorage.getItem("csw24:paint"));
  if (p) {
    const dark = p.mode === "dark" || (p.mode === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
    const r = document.documentElement, tok = p[dark ? "dark" : "light"];
    for (const k in tok) r.style.setProperty("--" + k, tok[k]);
    r.style.colorScheme = dark ? "dark" : "light";
    r.style.fontSize = p.size;
    r.dataset.values = p.values;
    r.dataset.tstyle = p.tstyle || "soft";
    r.dataset.tfont = p.tfont || "sans";
    document.getElementById("themeColor").content = tok.head;
  }
} catch {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: theme header with search + tabs; one content column of cards. Colours come from the theme in Settings
   (JS writes these tokens onto :root); the values here are the Board green theme as a fallback. */
:root {
  --bg: #edf1ee; --panel: #ffffff; --ink: #1b2420; --muted: #5b6a62; --line: #d3dcd6; --chip: #f2f5f3;
  --head: #1f5c4a; --head-ink: #e9f3ee; --field: #e9f3ee; --field-ink: #15211c;
  --tile: #f1dcaa; --tile-edge: #c4a566; --tile-ink: #2b2213;
  --accent: #b8364a; --on-accent: #ffffff; --link: #2b74a8;
  --good: #22804e; --bad: #b8364a; --new: #7d50c4; --warn: #a66300;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "Source Serif 4", Georgia, serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141c18; --panel: #1b2621; --ink: #e2ebe5; --muted: #93a69b; --line: #2c3b33; --chip: #22302a;
    --head: #1a4a3c; --head-ink: #e2f1e8; --field: #e2f1e8; --field-ink: #15211c;
    --tile: #e6cf97; --tile-edge: #a88d52; --tile-ink: #2b2213;
    --accent: #e8707f; --on-accent: #1b0f12; --link: #84bfe3; --good: #56c487; --bad: #e8707f; --new: #b592ef; --warn: #f0b45a;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 1rem/1.55 var(--body); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--link); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
::placeholder { text-transform: none; letter-spacing: normal; opacity: .6; }

header { background: var(--head); color: var(--head-ink); padding: 14px 16px 0; position: sticky; top: 0; z-index: 5; }
.wrap { max-width: 1100px; margin: 0 auto; }
.top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.top h1 { font: 800 1.3rem/1 var(--display); margin: 0; letter-spacing: -0.01em; white-space: nowrap; }
form.search { display: flex; gap: 8px; flex: 1 1 320px; min-width: 0; }
form.search input {
  flex: 1; min-width: 0; padding: 9px 12px; border-radius: 6px; border: 0;
  background: var(--field); color: var(--field-ink); font: 600 1.05rem var(--mono); letter-spacing: .08em; text-transform: uppercase;
}
nav.tabs { display: flex; gap: 2px; margin-top: 12px; overflow-x: auto; }
nav.tabs a { color: var(--head-ink); text-decoration: none; font: 600 .9rem var(--display); padding: 8px 14px; border-radius: 6px 6px 0 0; opacity: .72; white-space: nowrap; }
nav.tabs a:hover { opacity: 1; }
nav.tabs a.on { background: var(--bg); color: var(--ink); opacity: 1; }
nav.tabs a.end { margin-left: auto; }

.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 8px 13px; cursor: pointer; font: 600 .88rem var(--display); white-space: nowrap; text-decoration: none; color: var(--ink); display: inline-block; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.sm { padding: 4px 9px; font-size: .8rem; }
.btn.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
header .btn { background: transparent; color: var(--head-ink); border-color: color-mix(in srgb, var(--head-ink) 35%, transparent); }
header .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

main.wrap { padding: 22px 16px 32px; display: flex; flex-direction: column; gap: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; min-width: 0; }
.lbl { font: 700 .74rem var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
.title { font: 700 1.5rem/1.15 var(--display); margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 4px 0 0; max-width: 65ch; }
.small { font: .78rem/1.5 var(--mono); color: var(--muted); }
.empty { color: var(--muted); font-style: italic; margin: 0; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }

/* word page */
.tilerow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.tiles { display: flex; gap: 4px; flex-wrap: wrap; }
/* the tile's look (shadow, bevel, gloss…) is added by the Tile style setting; see TILE_STYLES */
.tile { --lip: 3px; width: 46px; height: 46px; background: var(--tile); color: var(--tile-ink); border-radius: 5px; position: relative;
  box-shadow: inset 0 calc(-1 * var(--lip)) 0 var(--tile-edge); display: grid; place-items: center; font: 700 1.6rem/1 var(--display); }
.tile sub { position: absolute; right: 4px; bottom: 5px; font: 600 .6rem var(--mono); }
:root[data-values="off"] .tile sub { display: none; }
.tiles.mini .tile { --lip: 2px; width: 30px; height: 30px; font-size: 1.05rem; border-radius: 4px; }
:root[data-tfont="serif"] .tile { font-family: var(--body); font-weight: 600; }
:root[data-tfont="mono"] .tile { font-family: var(--mono); font-weight: 600; }
.tiles.mini .tile sub { font-size: .45rem; right: 2px; bottom: 2px; }
.hook { display: flex; gap: 3px; flex-wrap: wrap; max-width: 150px; }
.hook button { border: 1px dashed var(--muted); background: none; border-radius: 4px; padding: 2px 6px; cursor: pointer; font: 600 .95rem var(--mono); }
.hook button:hover { border-style: solid; border-color: var(--accent); color: var(--accent); }
.hook.none { font: .74rem/1.3 var(--mono); color: var(--muted); }
.badges { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
.badge { font: 700 .7rem var(--display); letter-spacing: .06em; text-transform: uppercase; padding: 4px 9px; border-radius: 99px; border: 1.5px solid currentColor; text-decoration: none; }
.badge.good { color: var(--good); } .badge.bad { color: var(--bad); } .badge.new { color: var(--new); } .badge.plain { color: var(--muted); }
a.badge.plain:hover { color: var(--accent); }
.def { font-size: 1.2rem; margin: 0; }
.pos { font: .8rem var(--mono); color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.stat b { display: block; font: 700 1.2rem var(--display); font-variant-numeric: tabular-nums; }
.stat span { font: .74rem var(--mono); color: var(--muted); }
.words { display: flex; flex-wrap: wrap; gap: 6px; }
.w { font: 600 .9rem var(--mono); padding: 3px 8px; border-radius: 4px; background: var(--chip); border: 1px solid var(--line); cursor: pointer; text-decoration: none; color: var(--ink); }
.w:hover { border-color: var(--accent); color: var(--accent); }
.w sup, .wl sup, .fh sup, .bh sup, .hook sup { color: var(--new); font-size: .65em; }
.grp { display: flex; gap: 10px; align-items: baseline; padding: 5px 0; border-top: 1px dashed var(--line); }
.grp:first-child { border-top: 0; }
.grp > b { font: 700 .95rem var(--mono); color: var(--accent); width: 18px; flex: none; }
.online ol { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 8px; }
.ex { display: block; font-style: italic; color: var(--muted); }
.ex::before { content: "“"; } .ex::after { content: "”"; }
.links { display: flex; gap: 14px; flex-wrap: wrap; font: .85rem var(--mono); margin-top: 12px; }
textarea { width: 100%; min-height: 70px; border: 1px solid var(--line); border-radius: 6px; padding: 10px; background: var(--chip); resize: vertical; }

/* result rows: front hooks | word | back hooks | definition | probability */
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding-bottom: 12px; margin-bottom: 4px; border-bottom: 1px solid var(--line); }
.toolbar .count { font: 700 1rem var(--display); margin-right: auto; }
.chips { display: flex; gap: 4px; flex-wrap: wrap; }
select, .field input { border: 1px solid var(--line); background: var(--chip); border-radius: 6px; padding: 7px 9px; min-width: 0; }
.rows { display: flex; flex-direction: column; }
.r { display: grid; grid-template-columns: 4.5em max-content 4.5em minmax(0,1fr) auto auto; gap: 10px; align-items: baseline; padding: 6px 4px; border-top: 1px solid var(--line); cursor: pointer; }
.r:first-child { border-top: 0; }
.r:hover { background: var(--chip); }
.r .fh { text-align: right; font: .85rem var(--mono); color: var(--link); overflow-wrap: anywhere; }
.r .bh { font: .85rem var(--mono); color: var(--link); overflow-wrap: anywhere; }
.r .wl { font: 700 1rem var(--mono); letter-spacing: .04em; }
.r .wl mark { background: none; color: var(--accent); }
.r .d { color: var(--muted); font-size: .93rem; min-width: 0; }
.r .meta { font: .72rem var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.rows.nodefs .d, .rows.noprob .meta { display: none; }
.rows.nohooks .fh, .rows.nohooks .bh { visibility: hidden; }
@media (max-width: 620px) {
  .r { grid-template-columns: 3.2em max-content minmax(0,1fr) auto; }
  .r .st { grid-row: 1; grid-column: -2; font-size: 1.35rem; padding: 4px 6px; }
  .r .d { grid-column: 2 / -1; } .r .meta { display: none; }
  .rows.ranked .r { grid-template-columns: 2em 2.4em max-content minmax(0,1fr) auto; gap: 6px; }
  .rows.ranked .r .d { grid-column: 3 / -1; }
}
.more { margin-top: 12px; }
.rangebar { margin-top: 10px; gap: 6px; }
.rangebar input { width: 4.5em; border: 1px solid var(--line); background: var(--chip); border-radius: 6px; padding: 4px 7px; font: 600 .85rem var(--mono); }
.r .rk { font: 400 .74rem var(--mono); color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.rows.ranked .r { grid-template-columns: 3em 4.5em max-content 4.5em minmax(0,1fr) auto auto; }
/* star at the far right of each row: tap to add to / take off the study list */
.r .st { border: 0; background: none; cursor: pointer; font-size: 1.15rem; line-height: 1; padding: 2px 4px; color: var(--muted); opacity: .5; align-self: center; }
.r .st:hover { opacity: 1; color: var(--warn); }
.r .st.on { color: var(--warn); opacity: 1; }

/* forms */
.fs + .fs { border-top: 1px solid var(--line); margin-top: 16px; padding-top: 14px; }
.form { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px 16px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > label, .field > .flabel { font: 600 .72rem var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.field input { font: 600 .95rem var(--mono); text-transform: uppercase; width: 100%; }
.field input.lc { text-transform: none; font-family: var(--body); }
.field .hint { font: .72rem var(--mono); color: var(--muted); }
.field.wide { grid-column: span 2; }
@media (max-width: 480px) { .field.wide { grid-column: auto; } }
.pair { display: flex; gap: 8px; }
.pair input { width: 50%; }
.check { display: flex; gap: 8px; align-items: center; cursor: pointer; }
.check input { width: auto; margin: 0; }
.field > label.check { font: .95rem var(--body); text-transform: none; letter-spacing: 0; color: var(--ink); }
.help { font: .74rem/1.7 var(--mono); color: var(--muted); }
.help code { background: var(--chip); padding: 1px 4px; border-radius: 3px; color: var(--ink); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 16px; }

/* lists */
.listgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.lcard { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; }
.lcard:hover { border-color: var(--accent); }
.lcard b { font: 700 1rem var(--display); }
.lcard span { color: var(--muted); font-size: .88rem; line-height: 1.4; }
.lcard i { font: normal .74rem var(--mono); color: var(--muted); }
.sect { font: 700 .74rem var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 10px 0 -6px; }
.stem { display: flex; flex-direction: column; gap: 8px; padding: 14px 0; border-top: 1px solid var(--line); }
.stem:first-of-type { border-top: 0; }
.stem .letters { font: 700 1.05rem var(--mono); color: var(--accent); letter-spacing: .12em; }

/* quiz */
.qprompt { font: 800 2.4rem/1.1 var(--mono); letter-spacing: .14em; overflow-wrap: anywhere; }
.qdef { font-size: 1.3rem; }
.qinput { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--chip); font: 600 1.15rem var(--mono); text-transform: uppercase; min-width: 0; }
.progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.progress div { height: 100%; background: var(--good); }
.fb.ok { color: var(--good); font-weight: 600; } .fb.no { color: var(--warn); font-weight: 600; }
/* quiz uses calm colours instead of the red accent */
.quizv .btn.primary { background: var(--link); border-color: var(--link); color: var(--panel); }
.quizv .btn.on { background: var(--link); border-color: var(--link); color: var(--panel); }
.quizv :focus-visible { outline-color: var(--link); }
.w.got { border-color: var(--good); color: var(--good); }
.r.got, .r.miss { cursor: default; }
.practice { display: flex; flex-direction: column; gap: 12px; align-items: stretch; }
.pprog { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; font: .82rem var(--mono); color: var(--muted); }
.pprog b { color: var(--ink); font-size: 1rem; }
.pbar { flex: 1 1 120px; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.pbar div { height: 100%; background: var(--good); }
.ptiles { display: flex; justify-content: center; padding: 10px 0; }
.ptiles .tile { width: 52px; height: 52px; font-size: 1.8rem; }
@media (max-width: 480px) { .ptiles .tile { width: 40px; height: 40px; font-size: 1.35rem; } }
.r.got .wl { color: var(--good); } .r.miss .wl { color: var(--warn); }
.w.miss { border-color: var(--warn); color: var(--warn); }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.stype .btn { flex: 1 1 auto; text-align: center; }
.numpick { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.numpick input { width: 5em; text-align: center; }
html { scrollbar-width: none; }
html::-webkit-scrollbar { display: none; }
/* Study: the Lists · Practice · Quiz switch */
.studyseg { display: flex; background: var(--chip); border: 1px solid var(--line); border-radius: 12px; padding: 3px; }
.studyseg a { flex: 1; text-align: center; padding: 9px 0; border-radius: 9px; font: 600 .92rem var(--display); color: var(--muted); text-decoration: none; }
.studyseg a.on { background: var(--panel); color: var(--ink); box-shadow: 0 1px 3px rgb(0 0 0 / .15); }
.pbtns { display: flex; gap: 8px; }
.pbtns .btn { flex: 1; text-align: center; font-size: 1.05rem; line-height: 1.2; }
.pbtns .ib { flex: none; width: 3.4em; display: grid; place-items: center; }
.pbtns .no { color: var(--warn); border-color: var(--warn); }
.pbtns .yes { color: var(--good); border-color: var(--good); }
.pbtns [hidden] { display: none; }
.pbtns .no.on { background: var(--warn); border-color: var(--warn); color: var(--panel); }
.pbtns .yes.on { background: var(--good); border-color: var(--good); color: var(--panel); }
details.more-themes { margin-top: 10px; }
details.more-themes > summary { cursor: pointer; font: 600 .88rem var(--display); color: var(--link); padding: 6px 0; }
details.more-themes .swatches { margin-top: 8px; }

/* settings */
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.swatch { border: 2px solid var(--line); border-radius: 8px; padding: 0; cursor: pointer; overflow: hidden; text-align: left; background: var(--panel); }
.swatch.on { border-color: var(--accent); }
.swatch .bar { height: 26px; display: flex; align-items: center; gap: 4px; padding: 0 8px; }
.swatch .bar i { width: 14px; height: 14px; border-radius: 3px; display: block; }
.swatch .body { height: 34px; display: flex; align-items: center; gap: 6px; padding: 0 8px; }
.swatch .body i { height: 8px; border-radius: 4px; display: block; }
.swatch span { display: block; padding: 6px 8px; font: 600 .82rem var(--display); }
.swatch .swmain { display: block; width: 100%; border: 0; padding: 0; background: none; text-align: left; cursor: pointer; color: inherit; }
.tones { display: flex; gap: 4px; padding: 0 8px 8px; }
.tones button { flex: 1; display: flex; align-items: center; justify-content: center; gap: 5px; border: 1px solid var(--line); border-radius: 99px; background: var(--chip); padding: 3px 6px; font: 600 .7rem var(--display); color: var(--muted); cursor: pointer; }
.tones button.on { border-color: var(--accent); color: var(--ink); }
.tones i { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgb(0 0 0 / .18); flex: none; }
.tilepick { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.tilepick label { position: relative; }
.tilepick label input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; padding: 0; }
.tilepick button, .tilepick label { border: 2px solid transparent; background: none; padding: 2px; border-radius: 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; font: 600 .68rem var(--display); color: var(--muted); }
.tilepick .on { border-color: var(--accent); color: var(--ink); }
.tilepick .tile { width: 34px; height: 34px; font-size: 1.15rem; animation: none; }
.tilepick .tile sub { font-size: .45rem; right: 3px; bottom: 3px; }
.colours { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px 16px; }
.colour { display: flex; align-items: center; gap: 10px; }
.colour input[type=color] { width: 46px; height: 38px; padding: 2px; border: 1px solid var(--line); border-radius: 8px; background: var(--chip); cursor: pointer; flex: none; }
.colour b { font: 600 .9rem var(--display); display: block; }

/* search sections fold open and shut */
details.acc > summary { list-style: none; display: flex; align-items: center; gap: 10px; cursor: pointer; margin: 0; padding: 2px 0; }
details.acc > summary::-webkit-details-marker { display: none; }
details.acc > summary::after { content: ""; width: 8px; height: 8px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg); margin: -4px 4px 0 auto; transition: transform .15s; flex: none; }
details.acc[open] > summary::after { transform: rotate(-135deg); margin-top: 4px; }
details.acc[open] > summary { margin-bottom: 12px; }
details.acc .accn { font: 400 .74rem var(--mono); letter-spacing: 0; text-transform: none; color: var(--accent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

/* short tab names are for the phone only */
nav.tabs .sh { display: none; }

/* ---------- phone layout (desktop above 620px is untouched) ---------- */
@media (max-width: 620px) {
  header { padding: calc(10px + env(safe-area-inset-top)) 8px 0; }
  .top { padding: 0 4px; }
  .top h1 { display: none; }
  form.search { flex-basis: 100%; gap: 6px; }
  form.search input { font-size: 16px; padding: 10px 12px; }
  form.search .btn { padding: 9px 12px; }
  /* tabs stay at the top like on the computer, but share the width evenly with short names and tall tap areas */
  nav.tabs { margin-top: 10px; gap: 0; overflow: visible; justify-content: space-between; }
  nav.tabs a { flex: 1 1 auto; min-width: 0; text-align: center; padding: 12px 6px; font-size: .82rem; letter-spacing: -.01em; opacity: .8; }
  nav.tabs a.end { margin-left: 0; }
  nav.tabs .sh { display: inline; } nav.tabs .lg { display: none; }
  main.wrap { padding: 14px 12px 32px; gap: 12px; }
  .card { padding: 14px; border-radius: 10px; }
  .title { font-size: 1.3rem; }

  /* bigger touch targets; 16px inputs stop iOS zooming in on focus */
  .btn { padding: 10px 14px; }
  .btn.sm { padding: 7px 11px; font-size: .84rem; }

  /* forms: two columns, wide fields full width */
  .form { grid-template-columns: 1fr 1fr; gap: 12px; }

  .toolbar { gap: 8px; }

  .tiles:not(.mini) { --sz: min(42px, calc((100vw - 58px) / var(--n, 7) - 4px)); flex-wrap: nowrap; }

/* ---------- pills and sheets (a bottom sheet on a phone, a centred panel on a computer) ---------- */
.pill { display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 14px; border-radius: 99px; border: 1px solid var(--line); background: var(--panel); font: 600 .86rem var(--display); white-space: nowrap; color: var(--ink); cursor: pointer; flex: none; }
.pill.on { background: var(--head); border-color: var(--head); color: var(--head-ink); }
.pill.add { border-style: dashed; color: var(--muted); }
.pill .x { border: 0; background: none; color: inherit; opacity: .75; font-size: 1.15rem; line-height: 1; padding: 6px 0 6px 4px; margin-right: -6px; cursor: pointer; }
.sheetwrap { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; justify-content: flex-end; }
.sheetwrap[hidden] { display: none; }
.scrim { position: absolute; inset: 0; background: rgb(10 20 15 / .42); }
.sheet { position: relative; background: var(--panel); border-radius: 22px 22px 0 0; padding: 8px 16px calc(20px + env(safe-area-inset-bottom)); max-height: 85vh; max-height: 85dvh; overflow-y: auto; box-shadow: 0 -10px 30px rgb(0 0 0 / .2); animation: up .2s ease-out; }
@keyframes up { from { transform: translateY(40px); opacity: .4; } }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 10px; }
.sheet h3 { font: 700 1.15rem var(--display); margin: 0 0 10px; display: flex; justify-content: space-between; align-items: center; }
.sheet h3 button { border: 0; background: none; font: 600 .9rem var(--display); color: var(--link); min-height: 44px; cursor: pointer; }
.sheet [data-sec][hidden] { display: none; }
body.sheet-open { overflow: hidden; }
@media (min-width: 621px) {
  .sheetwrap { justify-content: center; align-items: center; }
  .sheet { width: min(620px, 92vw); border-radius: 16px; padding-bottom: 20px; }
  .sheet .grab { display: none; }
}

/* ---------- practice and word lists (every width; phone tweaks in the block below) ---------- */
.hscroll { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.hscroll::-webkit-scrollbar { display: none; }
.btn.block { width: 100%; min-height: 50px; font-size: 1rem; border-radius: 12px; margin-top: 16px; }

.fc-top { display: flex; align-items: center; gap: 6px; }

.fc-top .n { font: .78rem var(--mono); color: var(--muted); }

.ib2 svg, .rackbtns svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.fc-card { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 22px 10px 18px; text-align: center; box-shadow: 0 8px 24px -10px rgb(0 0 0 / .25); }
.slots, .rack .tiles:not(.mini) { --sz: min(46px, calc((100vw - 60px) / var(--n, 7) - 5px)); }
.slots { display: flex; justify-content: center; gap: 5px; min-height: var(--sz); }
.slot, .slots .tile { width: var(--sz); height: var(--sz); font-size: calc(var(--sz) * .58); flex: none; }
.slot { border-radius: 6px; border: 2px dashed var(--line); }
.slots.bad { animation: shake .35s; }

@keyframes shake { 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }

.found { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 12px; }

.rack { padding: 14px 6px 12px; border-radius: 14px; background: linear-gradient(180deg, color-mix(in srgb, var(--tile-edge) 72%, #000), color-mix(in srgb, var(--tile-edge) 50%, #000)); box-shadow: inset 0 2px 0 rgb(255 255 255 / .2), 0 6px 14px -4px rgb(0 0 0 / .4); }

/* wooden racks: two tones of the wood, fine grain lines along the rack, a lit top edge and a shadowed lip */
.rack[class*="wood-"] { --w1: #c99a5b; --w2: #93622f; --grain: rgb(70 40 10 / .16); --sheen: rgb(255 240 210 / .10);
  background:

    repeating-linear-gradient(181.5deg, transparent 0 17px, var(--grain) 17px 19px),

.rack.wood-walnut { --w1: #7b5236; --w2: #4a2e1b; --grain: rgb(20 10 0 / .25); }
.rack.wood-maple { --w1: #ecd3a4; --w2: #c9a066; --grain: rgb(120 80 30 / .13); --sheen: rgb(255 255 255 / .16); }
.rack.wood-cherry { --w1: #a85634; --w2: #6c2c17; --grain: rgb(40 5 0 / .2); }
.rack.wood-ebony { --w1: #463832; --w2: #1d1512; --grain: rgb(0 0 0 / .35); --sheen: rgb(255 230 200 / .06); }

.rack .tile.used { opacity: .28; transform: scale(.92); }

.tile.ghost { opacity: .25; }
.rackbtns { display: flex; gap: 8px; justify-content: center; margin-top: -2px; }
.rackbtns .btn { min-width: 56px; min-height: 46px; display: grid; place-items: center; border-radius: 12px; padding: 0 12px; color: var(--muted); }
.rackbtns .btn.on { color: var(--bg); }
.thumb .qinput { min-height: 50px; border-radius: 12px; font-size: 1.2rem; text-align: center; }
.thumb .qinput[hidden] { display: none; }
.thumb .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.thumb .btn { min-height: 54px; border-radius: 14px; font-size: 1rem; text-align: center; }
.thumb .no { color: var(--warn); border-color: var(--warn); } .thumb .yes { color: var(--good); border-color: var(--good); }
.thumb .no.on { background: var(--warn); color: var(--panel); } .thumb .yes.on { background: var(--good); color: var(--panel); }
.sheet #pOpts { border: 0; padding: 0; margin-top: 14px; }
.sheet #pOpts > summary { display: none; }
.sheet .chips { margin: 0 -16px; padding: 0 16px 2px; }
/* word lists: continue card, then sideways rows with progress bars */
.bigtitle { font: 800 1.9rem/1.1 var(--display); margin: 2px 4px 0; letter-spacing: -.01em; }
.cont { background: var(--head); color: var(--head-ink); border-radius: 16px; padding: 16px; display: flex; gap: 14px; align-items: center; cursor: pointer; }
.cont .ct { flex: 1; min-width: 0; }
.cont small { font: 700 .68rem var(--display); letter-spacing: .1em; text-transform: uppercase; opacity: .75; }
.cont b { display: block; font: 700 1.1rem var(--display); margin: 2px 0 8px; }
.cont .pbar { background: color-mix(in srgb, var(--head-ink) 25%, transparent); }
.cont .pbar div { background: var(--tile); }
.cont .small { color: inherit; opacity: .75; margin-top: 6px; }
.cont .go .play { width: 22px; height: 22px; fill: currentColor; display: block; }
.cont .go { width: 48px; height: 48px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-size: 1.1rem; flex: none; border: 0; cursor: pointer; }
.carow h4 { display: flex; justify-content: space-between; align-items: center; margin: 8px 4px 10px; font: 700 1.05rem var(--display); }
.carow h4 button { border: 0; background: none; font: 600 .84rem var(--display); color: var(--link); cursor: pointer; min-height: 36px; }
.cc { flex: none; width: 150px; min-height: 136px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; align-items: stretch; gap: 8px; text-align: left; cursor: pointer; color: var(--ink); }
.cc b { font: 700 .98rem/1.2 var(--display); }
.cc .foot { margin-top: auto; display: flex; flex-direction: column; gap: 5px; }
.cc i { font: normal .72rem var(--mono); color: var(--muted); }
.prog { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--good); }
.cc .tiles.mini { gap: 2px; flex-wrap: nowrap; overflow: hidden; }
.cc .tiles.mini .tile { width: 24px; height: 24px; font-size: .9rem; }

/* computer: list rows wrap instead of scrolling sideways */
@media (min-width: 621px) {

/* practice and quiz: the card in the middle, a stats panel on the right (underneath on narrower screens) */
main.wrap:has(> .foc) { max-width: 1400px; }
.foc { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 640px) minmax(0, 1fr); gap: 24px; align-items: start; }
.foc > .stage { grid-column: 2; }
.foc > .rail { grid-column: 3; max-width: 290px; position: sticky; top: 16px; }
@media (max-width: 1300px) { .foc { grid-template-columns: minmax(0, 1fr) 270px; } .foc > .stage { grid-column: 1; } .foc > .rail { grid-column: 2; } }
@media (max-width: 860px) { .foc { grid-template-columns: minmax(0, 1fr); } .foc > .rail { grid-column: 1; max-width: none; position: static; } }
.stage { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.rail { display: flex; flex-direction: column; gap: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.rail h4 { margin: 0 0 8px; display: flex; justify-content: space-between; align-items: baseline; font: 700 .74rem var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* ---------- phone: pill nav, word hero, search chips + sheets, practice, word lists ---------- */
@media (max-width: 620px) {

  .hero .tiles:not(.mini) { --sz: min(54px, calc((100vw - 48px) / var(--n, 7) - 4px)); justify-content: center; }
  .hstar { position: absolute; top: 0; right: 4px; width: 44px; height: 44px; border: 0; background: none; color: var(--head-ink); font-size: 1.5rem; cursor: pointer; opacity: .85; }

  .wpane { display: flex; flex-direction: column; gap: 12px; }

  .bigchips a { min-height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; font: 700 1.05rem var(--mono); letter-spacing: .06em; color: var(--ink); text-decoration: none; }

}

<script>
// Lexicon loader. The word list comes from words.js beside this page (local build), or from a copy the
// user loaded in Settings, which is kept in this browser's IndexedDB. The app script below starts once it's ready.
const LEX = {
  source: window.CSW_TSV ? "file" : null,
  db: () => new Promise((ok, no) => { const r = indexedDB.open("csw24", 1); r.onupgradeneeded = () => r.result.createObjectStore("lex"); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); }),
  async get() { const db = await LEX.db(); return new Promise((ok, no) => { const r = db.transaction("lex").objectStore("lex").get("tsv"); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); }); },
  async put(v) { const db = await LEX.db(); return new Promise((ok, no) => { const t = db.transaction("lex", "readwrite"), st = t.objectStore("lex"); v == null ? st.delete("tsv") : st.put(v, "tsv"); t.oncomplete = ok; t.onerror = () => no(t.error); }); },
  // accepts words.js from build.py, or the plain tab-separated text inside it
  parse(text) {
    const m = text.match(/^\s*window\.CSW_TSV\s*=\s*/);
    const tsv = m ? JSON.parse(text.slice(m[0].length).trim().replace(/;$/, "")) : text.trim();
    if (!/^[A-Z]+\t[^\n]*\t[^\n]*\t[^\n]*\t[^\n]*\t\d+/.test(tsv)) throw new Error("it isn't a words.js file from build.py");
    return tsv;

const G = id => id ? GROUPS.find(g => g.id === id) : undefined;
const cache = {};
const groupWords = g => cache[g.id] ||= (g.special === "stems" ? stems(g.n).map(s => s.stem) : ALL.filter(w => g.test(w, DICT.get(w))));
function stems(n) {
  if (cache["stemdata" + n]) return cache["stemdata" + n];
  const m = new Map();
  for (const w of BYLEN[n + 1]) {
    const a = alpha(w), seen = new Set();
    for (let i = 0; i < a.length; i++) {
      if (seen.has(a[i])) continue; seen.add(a[i]);
      const s = a.slice(0, i) + a.slice(i + 1);
      (m.get(s) || m.set(s, new Set()).get(s)).add(w);
    }
  }
  return cache["stemdata" + n] = [...m].map(([stem, set]) => ({ stem, n: set.size, words: [...set] })).sort((a, b) => b.n - a.n).slice(0, 150);
}
function groupOptions(selected, withSpecial) {
  let html = "", open = false;
  for (const g of GROUPS) {
    if (g.sect) { html += `${open ? "</optgroup>" : ""}<optgroup label="${g.sect}">`; open = true; }
    else if (withSpecial || !g.special) html += `<option value="${g.id}" ${g.id === selected ? "selected" : ""}>${esc(g.name)}</option>`;
  }
  return html + "</optgroup>";
}

function defHTML(d) {
  return d.split(" / ").map(part => {
    const m = part.match(/^(.*?)(\s*\[[^\]]+\])?$/);
    const body = esc(m[1]).replace(/\b[A-Z]{2,15}\b/g, x => DICT.has(x) ? `<a href="#w/${x}">${x}</a>` : x);
    return `<span>${body}${m[2] ? ` <span class="pos">${esc(m[2].trim())}</span>` : ""}</span>`;
  }).join("<br>");
}
const hookText = (letters, nw) => [...letters].map(h => nw.includes(h) ? `${h}<sup title="new hook in CSW24">+</sup>` : h).join("");
const chip = w => `<a class="w" href="#w/${w}" title="${esc(DICT.get(w)?.d)}">${w}${DICT.get(w)?.n ? "<sup>+</sup>" : ""}</a>`;
function tilesHTML(w, mini) {
  return `<div class="tiles${mini ? " mini" : ""}" style="--n:${w.length}">${[...w].map((c, i) => `<div class="tile" style="animation-delay:${i * 25}ms">${c}<sub>${VALUES[c]}</sub></div>`).join("")}</div>`;
}

const SORTS = { prob: "Probability", alpha: "A–Z", len: "Length", score: "Points", play: "Playability" };
const sorters = {
  prob: (a, b) => a.length - b.length || DICT.get(a).p - DICT.get(b).p,
  alpha: (a, b) => a < b ? -1 : 1,
  len: (a, b) => a.length - b.length || (a < b ? -1 : 1),
  score: (a, b) => score(b) - score(a) || (a < b ? -1 : 1),

function results(el, words, opts = {}) {
  // range = which ranks to show, counted in the current sort order (e.g. 1–100 or 30–50)

  const lens = [...new Set(words.map(w => w.length))].sort((a, b) => a - b);
  if (st.len && (!lens.includes(st.len) || lens.length < 2)) st.len = 0;
  function draw() {
    const full = (st.len ? words.filter(w => w.length === st.len) : [...words]).sort(sorters[SET.sort] || sorters.prob);

    const lo = Math.max(1, st.from || 1), hi = st.to ? Math.max(st.to, lo) : full.length;
    const list = ranged ? full.slice(lo - 1, hi) : full;
    const offset = ranged ? lo - 1 : 0;
    lastResults = list;
    const starSet = new Set(getStars()), allStarred = list.length > 0 && list.every(w => starSet.has(w));
    const total = st.len ? `${full.length.toLocaleString()} ${st.len}-letter words <span class="small">(${words.length.toLocaleString()} in all)</span>` : `${full.length.toLocaleString()} word${full.length === 1 ? "" : "s"}`;
    el.innerHTML = `
      <div class="toolbar">

        <button class="btn sm ${ranged ? "" : "on"}" data-top="0">All</button>
        <span class="small">in ${SORTS[SET.sort] || "Probability"} order</span>

      ${list.length ? `<div class="rows ${ranged ? "ranked" : ""} ${SET.defs ? "" : "nodefs"} ${SET.prob ? "" : "noprob"} ${SET.hooks ? "" : "nohooks"}">${list.slice(0, st.shown).map((w, i) => rowHTML(w, opts.masks?.get(w), ranged ? offset + i + 1 : 0, starSet)).join("")}</div>` : `<p class="empty" style="margin-top:10px">${ranged && full.length ? `There are only ${full.length.toLocaleString()} words, so rank ${lo.toLocaleString()} is past the end.` : "No words match."}</p>`}

    };

async function fetchOnline(w) {
  const lw = w.toLowerCase();

    const r = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(lw)}`);

      phon ||= ent.phonetic || ent.phonetics?.find(p => p.text)?.text || "";
      audio ||= ent.phonetics?.find(p => p.audio)?.audio || "";
      origin ||= ent.origin || "";
      for (const m of ent.meanings || []) for (const d of m.definitions || [])
        parts.push({ pos: m.partOfSpeech, def: d.definition, ex: d.example, syn: [...(d.synonyms || []), ...(m.synonyms || [])] });
    }
  } catch {}
  try {
    const r = await fetch(`https://en.wiktionary.org/api/rest_v1/page/definition/${encodeURIComponent(lw)}`);

      : `<p class="empty">No online dictionary entry. Many Scrabble words are rare, so lean on the CSW definition and your own memory hook.</p>`}
    ${syns.length ? `<p class="small" style="margin:10px 0 4px">Valid synonyms</p><div class="words">${syns.map(chip).join("")}</div>` : ""}
    ${origin ? `<p class="small" style="margin-top:10px">Origin: ${esc(origin)}</p>` : ""}
    <div class="links">
      <a href="https://en.wiktionary.org/wiki/${encodeURIComponent(lw)}" target="_blank" rel="noopener">Wiktionary</a>
      <a href="https://www.collinsdictionary.com/dictionary/english/${encodeURIComponent(lw)}" target="_blank" rel="noopener">Collins</a>
      <a href="https://www.google.com/search?tbm=isch&q=${encodeURIComponent(lw + " meaning")}" target="_blank" rel="noopener">Images</a>

const SEARCH_DEFAULT = { pattern: "", rack: "", mode: "exact", min: "", max: "", starts: "", ends: "", contains: "", incl: "", excl: "", def: "", group: "", top: "", from: "", to: "" };

function patternRegex(p) {
  if (!/^[A-Z.?*\[\]^]+$/.test(p)) return null;
  let out = "", inSet = false;
  for (const c of p) {
    if (c === "[") inSet = true; else if (c === "]") inSet = false;
    out += inSet ? (c === "." || c === "?" || c === "*" ? "\\" + c : c) : c === "." || c === "?" ? "[A-Z]" : c === "*" ? "[A-Z]*" : c === "^" ? "" : c;

}
function runSearch(s) {
  const up = v => (v || "").toUpperCase().replace(/[^A-Z?.*\[\]^]/g, "");
  const letters = v => (v || "").toUpperCase().replace(/[^A-Z]/g, "");
  const pat = up(s.pattern), rack = up(s.rack).replace(/[^A-Z?]/g, "");
  const re = pat ? patternRegex(pat) : null;
  if (pat && !re) return { error: "That pattern isn't valid. Use letters, . or ?, *, and [ABC] sets." };
  const min = +s.min || 0, max = +s.max || 99;
  const starts = letters(s.starts), ends = letters(s.ends), contains = letters(s.contains);
  const incl = counts(letters(s.incl)), excl = new Set(letters(s.excl));
  const def = (s.def || "").trim().toLowerCase();
  const group = s.group ? G(s.group) : null;
  const top = +s.top || 0;
  const rl = rack.replace(/\?/g, ""), rb = rack.length - rl.length, rc = counts(rl);
  const masks = rack && rb ? new Map() : null;
  const pool = rack && s.mode === "exact" ? BYLEN[rack.length] || [] : group ? groupWords(group) : ALL;
  const out = [];
  for (const w of pool) {
    const len = w.length;
    if (len < min || len > max) continue;
    if (starts && !w.startsWith(starts)) continue;
    if (ends && !w.endsWith(ends)) continue;
    if (contains && !w.includes(contains)) continue;
    if (re && !re.test(w)) continue;
    if (excl.size && [...w].some(c => excl.has(c))) continue;
    const e = DICT.get(w);
    if (top && e.p > top) continue;
    if (group && !group.test(w, e)) continue;
    if (Object.keys(incl).length) { const wc = counts(w); if (Object.entries(incl).some(([c, n]) => (wc[c] || 0) < n)) continue; }
    if (rack) {
      if (s.mode === "exact" || s.mode === "build") { if (blanksNeeded(w, rc) > rb) continue; }
      else { const wc = counts(w); if (len < rl.length || Object.entries(rc).some(([c, n]) => (wc[c] || 0) < n)) continue; }
      if (masks && s.mode !== "super") masks.set(w, blankMask(w, rc));
    }
    if (def && !e.d.toLowerCase().includes(def)) continue;
    out.push(w);
  }
  return { words: out, masks };
}

  if (mine) { const set = new Set(mine); pool = pool.filter(w => set.has(w)); }
  if (o.starOnly) { const set = new Set(getStars()); pool = pool.filter(w => set.has(w)); }

  $("#view").querySelectorAll("[data-psrc]").forEach(b => b.onclick = () => { const v = b.dataset.psrc; saveSettings({ practice: { ...PO_DEFAULT, src: v, len: v.startsWith("g:") ? G(v.slice(2))?.len || 0 : 0 } }); VIEWS.practice(); });
  $("#pGo").onclick = $("#pStart").onclick = () => { if (pool.length) location.hash = "practice/go"; };
}

// ---------- my words ----------
const getStars = () => store.get("stars", []);
const getNotes = () => store.get("notes", {});
function toggleStar(w) { const s = getStars(); const i = s.indexOf(w); i >= 0 ? s.splice(i, 1) : s.unshift(w); store.set("stars", s); return i < 0; }
function addHistory(w) { const h = store.get("hist", []).filter(x => x !== w); h.unshift(w); store.set("hist", h.slice(0, 50)); }

VIEWS.mine = (tab) => {
  tab ||= "stars";
  const notes = getNotes();
  const tabs = { stars: ["Study list", getStars()], missed: ["Missed in quizzes", store.get("missed", [])], notes: ["With memory hooks", Object.keys(notes)], hist: ["Recently viewed", store.get("hist", [])] };
  $("#view").innerHTML = `<div><h3 class="title">My words</h3><p class="sub">Saved in this browser.</p></div>
    <div class="seg">${Object.entries(tabs).map(([k, [n, l]]) => `<a class="btn ${k === tab ? "on" : ""}" href="#mine/${k}">${n} (${l.length})</a>`).join("")}</div>
    ${tab === "stars" ? `<div class="row"><button class="btn sm" id="copyList">Copy list</button><button class="btn sm" id="clearStars">Clear study list</button><span class="small" id="msg"></span></div>` : ""}
    ${tab === "missed" ? `<div class="row"><button class="btn sm" id="clearMissed">Clear missed</button></div>` : ""}
    <div class="card" id="mres"></div>`;
  const words = tabs[tab][1].filter(w => DICT.has(w));
  if (tab === "notes") {
    $("#mres").innerHTML = words.length ? `<div class="rows">${words.map(w => `<div class="r" data-go="${w}"><span class="fh"></span><span class="wl">${w}</span><span class="bh"></span><span class="d">${esc(notes[w])}</span><span></span></div>`).join("")}</div>` : `<p class="empty">Write a memory hook on any word page and it shows up here.</p>`;
  } else if (words.length) results($("#mres"), words);
  else $("#mres").innerHTML = `<p class="empty">${tab === "stars" ? "Press ☆ Star on a word, or Star all on any list." : "Nothing here yet."}</p>`;
  $("#copyList")?.addEventListener("click", () => navigator.clipboard?.writeText(getStars().join("\n")).then(() => $("#msg").textContent = "Copied").catch(() => $("#msg").textContent = "Copy blocked by the browser"));
  confirmBtn($("#clearStars"), () => { store.set("stars", []); VIEWS.mine("stars"); });
  $("#clearMissed")?.addEventListener("click", () => { store.set("missed", []); VIEWS.mine("missed"); });
};
// two-press confirmation for destructive buttons
function confirmBtn(el, fn) {
  if (!el) return;
  let armed = false; const label = el.textContent;
  el.addEventListener("click", () => { if (armed) return fn(); armed = true; el.textContent = "Press again to confirm"; setTimeout(() => { armed = false; el.textContent = label; }, 3000); });
}

// ---------- settings ----------
VIEWS.settings = () => {
  const seg = (key, opts) => `<div class="seg">${opts.map(([v, t]) => `<button type="button" class="btn ${String(SET[key]) === String(v) ? "on" : ""}" data-set="${key}" data-val="${v}">${t}</button>`).join("")}</div>`;
  const chk = (key, label) => `<label class="check"><input type="checkbox" data-chk="${key}" ${SET[key] ? "checked" : ""}> ${label}</label>`;
  const tileBtn = (id, name, c) => { const tok = c ? { tile: c, ink: inkOn(c) === "#ffffff" ? "#fbf6ea" : "#2a1f0e", edge: mix(c, "#000000", .26) } : null;
    return `<button type="button" class="${SET.tiles === id ? "on" : ""}" data-tiles="${id}"><div class="tile" ${tok ? `style="background-color:${tok.tile};--tile:${tok.tile};color:${tok.ink};--tile-edge:${tok.edge}"` : ""}>A<sub>1</sub></div>${name}</button>`; };
  const colour = (key, title, sub) => `<label class="colour"><input type="color" data-colour="${key}" value="${SET[key] || getComputedStyle(document.documentElement).getPropertyValue("--" + (key === "headCustom" ? "head" : "accent")).trim()}">
      <span><b>${title}</b><span class="small">${SET[key] ? `Custom · <a href="#" data-uncolour="${key}">use theme</a>` : sub}</span></span></label>`;
  const themeList = Object.entries(THEMES);
  // the first five always show; the rest sit in their groups inside the dropdown
  const top5 = new Set(themeList.slice(0, 5).map(([id]) => id)), grouped = new Set(THEME_GROUPS.flatMap(g => g[1]));
  const moreGroups = [...THEME_GROUPS, ["Other", themeList.map(([id]) => id).filter(id => !grouped.has(id))]]
    .map(([g, ids]) => [g, ids.filter(id => THEMES[id] && !top5.has(id))]).filter(([, ids]) => ids.length);
  // a swatch: the theme preview, plus its Bright / Mellow light-mode tones (hidden while the page is dark)
  const tone = (id, t, k, n) => { const c = k === "bright" ? t.light : t.mellow, on = (SET.tones?.[id] === "bright") === (k === "bright");
    return `<button type="button" class="${on ? "on" : ""}" data-tone="${k}" data-tid="${id}"><i style="background:linear-gradient(135deg, ${c.bg} 50%, ${c.panel} 50%)"></i>${n}</button>`; };
  const swatch = (id, t) => { const c = isDark() ? t.dark : lightOf(id, t); return `<div class="swatch ${SET.theme === id ? "on" : ""}"><button type="button" class="swmain" data-theme="${id}">
      <div class="bar" style="background:${c.head}"><i style="background:${c.tile}"></i><i style="background:${c.tile}"></i><i style="background:${c.accent}"></i></div>
      <div class="body" style="background:${c.bg}"><i style="width:40%;background:${c.ink}"></i><i style="width:20%;background:${c.link}"></i></div>
      <span>${t.name}</span></button>${t.mellow && !isDark() ? `<div class="tones">${tone(id, t, "bright", "Bright")}${tone(id, t, "mellow", "Mellow")}</div>` : ""}</div>`; };
  $("#view").innerHTML = `<div><h3 class="title">Settings</h3><p class="sub">Saved in this browser and applied straight away.</p></div>
  <div class="card">
    <div class="fs"><h2 class="lbl">Colour theme</h2><div class="swatches">${themeList.slice(0, 5).map(([id, t]) => swatch(id, t)).join("")}</div>
      <details class="more-themes" id="moreThemes" ${store.get("themesOpen", false) ? "open" : ""}><summary>More themes (${themeList.length - 5})${themeList.findIndex(([id]) => id === SET.theme) >= 5 ? ` · using ${esc(THEMES[SET.theme].name)}` : ""}</summary>
        ${moreGroups.map(([g, ids]) => `<div class="sect" style="margin:14px 0 0">${g}</div><div class="swatches">${ids.map(id => swatch(id, THEMES[id])).join("")}</div>`).join("")}</details></div>
    <div class="fs"><h2 class="lbl">Light or dark</h2>${seg("mode", [["auto", "Match my device"], ["light", "Light"], ["dark", "Dark"]])}</div>
    <div class="fs"><h2 class="lbl">Light mode brightness</h2>${seg("glare", [["bright", "Bright"], ["soft", "Soft"], ["dim", "Dim"]])}<p class="small" style="margin:8px 0 0">How white the page and cards are in light mode.</p></div>
    <div class="fs"><h2 class="lbl">Text size</h2>${seg("size", [["sm", "Small"], ["md", "Normal"], ["lg", "Large"]])}</div>
    <div class="fs"><h2 class="lbl">Tile colour</h2><div class="tilepick">${Object.entries(TILES).map(([id, [n, c]]) => tileBtn(id, n, c || (isDark() ? (THEMES[SET.theme] || THEMES.board).dark : lightOf(SET.theme, THEMES[SET.theme] || THEMES.board)).tile)).join("")}
      <label class="pickc ${SET.tiles === "custom" ? "on" : ""}"><div class="tile" style="background:conic-gradient(#e74c3c,#f1c40f,#2ecc71,#3498db,#9b59b6,#e74c3c);color:#fff">?</div>Pick…<input type="color" id="tileCustom" value="${SET.tileCustom}" aria-label="Pick a tile colour"></label></div>
      <h2 class="lbl" style="margin-top:18px">Tile style</h2>
      <div class="tilepick tstyles"><button type="button" class="${SET.tileLook === "theme" ? "on" : ""}" data-tstyle-pick="theme" title="Each theme picks its own: ${esc(TILE_STYLES[THEME_TSTYLE[SET.theme] || "soft"][0])}"><div class="tile ts-${THEME_TSTYLE[SET.theme] || "soft"}">A<sub>1</sub></div>Theme</button>${Object.entries(TILE_STYLES).map(([id, [n]]) => `<button type="button" class="${SET.tileLook === id ? "on" : ""}" data-tstyle-pick="${id}"><div class="tile ts-${id}">A<sub>1</sub></div>${n}</button>`).join("")}</div>
      <h2 class="lbl" style="margin-top:18px">Tile letters</h2>${seg("tileFont", [["sans", "Bold"], ["serif", "Serif"], ["mono", "Typewriter"]])}
      <div style="margin-top:16px">${tilesHTML(sampleWord())}</div>
      <div style="margin-top:12px">${chk("values", "Show letter values on tiles")}</div>
      <h2 class="lbl" style="margin-top:18px">Rack</h2>
      <div class="rackpick">${RACKS.map(([id, n]) => `<button type="button" class="${(SET.rackLook || "oak") === id ? "on" : ""}" data-rack-pick="${id}"><div class="rack wood-${id}"><div class="tiles">${[..."RACK"].map(c => `<div class="tile">${c}<sub>${VALUES[c]}</sub></div>`).join("")}</div></div>${n}</button>`).join("")}</div></div>
    <div class="fs"><h2 class="lbl">Custom colours</h2><p class="small" style="margin:0 0 10px">Tap a colour to open the colour wheel. These sit on top of whichever theme you pick.</p>
      <div class="colours">${colour("headCustom", "Header", "From the theme")}${colour("accentCustom", "Accent", "Buttons and highlights, from the theme")}</div></div>
  </div>
  <div class="card">
    <div class="fs"><h2 class="lbl">Word lists and search results</h2><div class="form">
      <div class="field"><label for="setSort">Default sort</label><select id="setSort">${Object.entries(SORTS).map(([k, v]) => `<option value="${k}" ${k === SET.sort ? "selected" : ""}>${v}</option>`).join("")}</select></div>
      <div class="field"><label for="setPage">Words per page</label><select id="setPage">${[100, 300, 1000, 3000].map(n => `<option ${n === +SET.pageSize ? "selected" : ""}>${n}</option>`).join("")}</select></div>
      <div class="field" style="gap:8px"><span class="flabel">Show in each row</span>${chk("defs", "Definitions")}${chk("hooks", "Hooks")}${chk("prob", "Probability rank")}</div>
    </div></div>
    <div class="fs"><h2 class="lbl">Word page</h2>${chk("online", "Look up pronunciation, examples and origin online")}</div>
    <div class="fs"><h2 class="lbl">Quiz</h2><div class="form">
      <div class="field"><label for="setPhony">Phony share in Valid-or-phony</label><select id="setPhony">${[25, 50, 75].map(n => `<option value="${n}" ${n === +SET.phony ? "selected" : ""}>${n}% phonies</option>`).join("")}</select></div>
    </div></div>
    <div class="fs"><h2 class="lbl">Random word</h2><div class="form"><div class="field"><span class="flabel">Length range</span><div class="pair">
      <select id="setRmin" aria-label="Shortest">${range(2, 15).map(n => `<option ${n === +SET.randMin ? "selected" : ""}>${n}</option>`).join("")}</select>
      <select id="setRmax" aria-label="Longest">${range(2, 15).map(n => `<option ${n === +SET.randMax ? "selected" : ""}>${n}</option>`).join("")}</select></div></div></div></div>
  </div>
  <div class="card">
    <div class="fs"><h2 class="lbl">Lexicon</h2>${LEX.html()}</div>
  </div>
  <div class="card">
    <div class="fs"><h2 class="lbl">Your data</h2><p class="small" style="margin:0 0 10px">Study list ${getStars().length} · memory hooks ${Object.keys(getNotes()).length} · quiz records ${Object.keys(store.get("stats", {})).length}</p>
      <div class="row"><button class="btn sm" id="clrHist">Clear history</button><button class="btn sm" id="clrStats">Clear quiz records</button><button class="btn sm" id="clrReview">Clear practice review (${getPQ().items.length})</button><button class="btn sm" id="resetSet">Reset settings</button></div></div>
  </div>`;
  const v = $("#view");
  v.querySelectorAll("[data-theme]").forEach(b => b.onclick = () => { saveSettings({ theme: b.dataset.theme }); VIEWS.settings(); });
  v.querySelectorAll("[data-tone]").forEach(b => b.onclick = () => { saveSettings({ theme: b.dataset.tid, tones: { ...SET.tones, [b.dataset.tid]: b.dataset.tone } }); VIEWS.settings(); });
  v.querySelectorAll("[data-set]").forEach(b => b.onclick = () => { saveSettings({ [b.dataset.set]: b.dataset.val }); VIEWS.settings(); });
  $("#moreThemes").addEventListener("toggle", e => store.set("themesOpen", e.target.open));
  v.querySelectorAll("[data-rack-pick]").forEach(b => b.onclick = () => { saveSettings({ rackLook: b.dataset.rackPick }); VIEWS.settings(); });
  v.querySelectorAll("[data-tstyle-pick]").forEach(b => b.onclick = () => { saveSettings({ tileLook: b.dataset.tstylePick }); VIEWS.settings(); });
  v.querySelectorAll("[data-tiles]").forEach(b => b.onclick = () => { saveSettings({ tiles: b.dataset.tiles }); VIEWS.settings(); });
  // colour inputs preview live while the wheel is open and redraw the page once a colour is chosen
  const tc = $("#tileCustom");
  tc.oninput = () => saveSettings({ tiles: "custom", tileCustom: tc.value });
  tc.onchange = () => VIEWS.settings();
  v.querySelectorAll("[data-colour]").forEach(i => { i.oninput = () => saveSettings({ [i.dataset.colour]: i.value }); i.onchange = () => VIEWS.settings(); });
  v.querySelectorAll("[data-uncolour]").forEach(a => a.onclick = ev => { ev.preventDefault(); saveSettings({ [a.dataset.uncolour]: "" }); VIEWS.settings(); });
  v.querySelectorAll("[data-chk]").forEach(c => c.onchange = () => saveSettings({ [c.dataset.chk]: c.checked }));
  $("#setSort").onchange = e => saveSettings({ sort: e.target.value });
  $("#setPage").onchange = e => saveSettings({ pageSize: +e.target.value });
  $("#setPhony").onchange = e => saveSettings({ phony: +e.target.value });
  $("#setRmin").onchange = e => saveSettings({ randMin: +e.target.value, randMax: Math.max(+e.target.value, SET.randMax) });
  $("#setRmax").onchange = e => saveSettings({ randMax: +e.target.value, randMin: Math.min(+e.target.value, SET.randMin) });
  LEX.wire();
  confirmBtn($("#lexDel"), () => LEX.put(null).then(() => location.reload()));
  confirmBtn($("#clrHist"), () => { store.set("hist", []); VIEWS.settings(); });
  confirmBtn($("#clrReview"), () => { store.set("pq", { n: getPQ().n, items: [] }); VIEWS.settings(); });
  confirmBtn($("#clrStats"), () => { store.set("stats", {}); store.set("missed", []); VIEWS.settings(); });
  confirmBtn($("#resetSet"), () => { SET = { ...SET_DEFAULT }; store.set("settings", SET); applySettings(); VIEWS.settings(); });
};
// the tile-colour preview shows the word in the search bar, else the last word viewed
const sampleWord = () => [$("#q").value, store.get("hist", [])[0], "SCRABBLE"].map(w => (w || "").toUpperCase().replace(/[^A-Z]/g, "").slice(0, 15)).find(Boolean);
const range = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => a + i);

// ---------- study: Lists, Practice and Quiz share one tab, with a switch along the top ----------
const STUDY = ["lists", "practice", "quiz"];
for (const k of STUDY) {
  const f = VIEWS[k];
  VIEWS[k] = arg => {
    f(arg);
    const top = !(k === "lists" && arg) && location.hash !== "#practice/go" && !(k === "quiz" && Q && !Q.done);
    if (top && !$("#view .studyseg")) $("#view").insertAdjacentHTML("afterbegin", `<nav class="studyseg">${[["lists", "Lists"], ["practice", "Practice"], ["quiz", "Quiz"]].map(([h, n]) => `<a href="#${h}" class="${h === k ? "on" : ""}">${n}</a>`).join("")}</nav>`);
  };
}

// ---------- routing ----------
function route() {
  commitPractice();
  const [tab, arg] = decodeURIComponent(location.hash.slice(1)).split("/");
  const t = VIEWS[tab] ? tab : "w";
  // Lists, Practice and Quiz share the Study tab, which goes back to whichever was used last
  if (STUDY.includes(t)) store.set("studyLast", t);
  $('#tabs [data-tab="study"]').href = "#" + store.get("studyLast", "lists");
  document.querySelectorAll("#tabs a").forEach(a => a.classList.toggle("on", a.dataset.tab === t || (a.dataset.tab === "study" && STUDY.includes(t))));
  if (t !== "quiz") document.onkeydown = null;
  $("#view").classList.toggle("quizv", t === "quiz" || t === "practice");
  // phone: Practice is full screen (no header) only once started; a sheet left open elsewhere is closed
  document.body.classList.toggle("full", t === "practice" && arg === "go");
  document.body.classList.remove("sheet-open");
  if (t !== "practice") pSheetOpen = false;
  VIEWS[t](arg);
  window.scrollTo({ top: 0 });
}
window.addEventListener("hashchange", route);
$("#form").addEventListener("submit", ev => {
  ev.preventDefault();
  const q = $("#q").value.toUpperCase().replace(/[^A-Z?.*\[\]^]/g, "");
  if (!q) return;
  const tab = location.hash.slice(1).split("/")[0], onSearch = tab === "search";
  // on the Word page a plain word opens that word; everything else is a search
  if (/^[A-Z]+$/.test(q) && (!VIEWS[tab] || tab === "w")) { location.hash = "w/" + q; return; }
  // on the Search page the bar replaces just the letters, keeping the group, length and other filters
  const keep = onSearch ? Object.fromEntries(Object.entries(searchState).filter(([k]) => !LETTER_KEYS.includes(k))) : {};
  searchFromBar = true; searchState = { ...SEARCH_DEFAULT, ...keep, ...barSearch(q) }; store.set("search", searchState);
  onSearch ? VIEWS.search() : location.hash = "search";
});
$("#randBtn").addEventListener("click", () => {
  const lo = Math.min(SET.randMin, SET.randMax), hi = Math.max(SET.randMin, SET.randMax);
  const pool = BYLEN[lo + Math.floor(Math.random() * (hi - lo + 1))];
  location.hash = "w/" + pool[Math.floor(Math.random() * pool.length)];
});
document.addEventListener("click", ev => {
  const sb = ev.target.closest("[data-star]");
  if (sb) {
    ev.preventDefault();
    const w = sb.dataset.star, on = toggleStar(w);
    document.querySelectorAll(`[data-star="${w}"]`).forEach(b => b.outerHTML = starBtn(w, on));
    return;
  }
  const t = ev.target.closest("[data-go]");
  if (t) { ev.preventDefault(); location.hash = "w/" + t.dataset.go; }
});
route();
</script>
</body>
