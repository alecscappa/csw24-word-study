<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSW24 Word Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: theme header with search + tabs; one content column of cards. Colours come from the theme in Settings
   (JS writes these tokens onto :root); the values here are the Board green theme as a fallback. */
:root {
  --bg: #edf1ee; --panel: #ffffff; --ink: #1b2420; --muted: #5b6a62; --line: #d3dcd6; --chip: #f2f5f3;
  --head: #1f5c4a; --head-ink: #e9f3ee; --field: #e9f3ee; --field-ink: #15211c;
  --tile: #f1dcaa; --tile-edge: #c4a566; --tile-ink: #2b2213;
  --accent: #b8364a; --on-accent: #ffffff; --link: #2b74a8;
  --good: #22804e; --bad: #b8364a; --new: #7d50c4; --warn: #a66300;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "Source Serif 4", Georgia, serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141c18; --panel: #1b2621; --ink: #e2ebe5; --muted: #93a69b; --line: #2c3b33; --chip: #22302a;
    --head: #1a4a3c; --head-ink: #e2f1e8; --field: #e2f1e8; --field-ink: #15211c;
    --tile: #e6cf97; --tile-edge: #a88d52; --tile-ink: #2b2213;
    --accent: #e8707f; --on-accent: #1b0f12; --link: #84bfe3; --good: #56c487; --bad: #e8707f; --new: #b592ef; --warn: #f0b45a;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 1rem/1.55 var(--body); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--link); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
::placeholder { text-transform: none; letter-spacing: normal; opacity: .6; }

header { background: var(--head); color: var(--head-ink); padding: 14px 16px 0; position: sticky; top: 0; z-index: 5; }
.wrap { max-width: 1100px; margin: 0 auto; }
.top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.top h1 { font: 800 1.3rem/1 var(--display); margin: 0; letter-spacing: -0.01em; white-space: nowrap; }
form.search { display: flex; gap: 8px; flex: 1 1 320px; min-width: 0; }
form.search input {
  flex: 1; min-width: 0; padding: 9px 12px; border-radius: 6px; border: 0;
  background: var(--field); color: var(--field-ink); font: 600 1.05rem var(--mono); letter-spacing: .08em; text-transform: uppercase;
}
nav.tabs { display: flex; gap: 2px; margin-top: 12px; overflow-x: auto; }
nav.tabs a { color: var(--head-ink); text-decoration: none; font: 600 .9rem var(--display); padding: 8px 14px; border-radius: 6px 6px 0 0; opacity: .72; white-space: nowrap; }
nav.tabs a:hover { opacity: 1; }
nav.tabs a.on { background: var(--bg); color: var(--ink); opacity: 1; }
nav.tabs a.end { margin-left: auto; }

.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 8px 13px; cursor: pointer; font: 600 .88rem var(--display); white-space: nowrap; text-decoration: none; color: var(--ink); display: inline-block; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.sm { padding: 4px 9px; font-size: .8rem; }
.btn.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
header .btn { background: transparent; color: var(--head-ink); border-color: color-mix(in srgb, var(--head-ink) 35%, transparent); }
header .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

main.wrap { padding: 22px 16px 70px; display: flex; flex-direction: column; gap: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; min-width: 0; }
.lbl { font: 700 .74rem var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
.title { font: 700 1.5rem/1.15 var(--display); margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 4px 0 0; max-width: 65ch; }
.small { font: .78rem/1.5 var(--mono); color: var(--muted); }
.empty { color: var(--muted); font-style: italic; margin: 0; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }

/* word page */
.tilerow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.tiles { display: flex; gap: 4px; flex-wrap: wrap; }
.tile { width: 46px; height: 46px; background: var(--tile); color: var(--tile-ink); border-radius: 5px; box-shadow: inset 0 -3px 0 var(--tile-edge); position: relative; display: grid; place-items: center; font: 700 1.6rem/1 var(--display); }
.tile sub { position: absolute; right: 4px; bottom: 5px; font: 600 .6rem var(--mono); }
:root[data-values="off"] .tile sub { display: none; }
.tiles.mini .tile { width: 30px; height: 30px; font-size: 1.05rem; border-radius: 4px; box-shadow: inset 0 -2px 0 var(--tile-edge); }
.tiles.mini .tile sub { font-size: .45rem; right: 2px; bottom: 2px; }
.hook { display: flex; gap: 3px; flex-wrap: wrap; max-width: 150px; }
.hook button { border: 1px dashed var(--muted); background: none; border-radius: 4px; padding: 2px 6px; cursor: pointer; font: 600 .95rem var(--mono); }
.hook button:hover { border-style: solid; border-color: var(--accent); color: var(--accent); }
.hook.none { font: .74rem/1.3 var(--mono); color: var(--muted); }
.badges { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
.badge { font: 700 .7rem var(--display); letter-spacing: .06em; text-transform: uppercase; padding: 4px 9px; border-radius: 99px; border: 1.5px solid currentColor; text-decoration: none; }
.badge.good { color: var(--good); } .badge.bad { color: var(--bad); } .badge.new { color: var(--new); } .badge.plain { color: var(--muted); }
a.badge.plain:hover { color: var(--accent); }
.def { font-size: 1.2rem; margin: 0; }
.pos { font: .8rem var(--mono); color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.stat b { display: block; font: 700 1.2rem var(--display); font-variant-numeric: tabular-nums; }
.stat span { font: .74rem var(--mono); color: var(--muted); }
.words { display: flex; flex-wrap: wrap; gap: 6px; }
.w { font: 600 .9rem var(--mono); padding: 3px 8px; border-radius: 4px; background: var(--chip); border: 1px solid var(--line); cursor: pointer; text-decoration: none; color: var(--ink); }
.w:hover { border-color: var(--accent); color: var(--accent); }
.w sup, .wl sup, .fh sup, .bh sup, .hook sup { color: var(--new); font-size: .65em; }
.grp { display: flex; gap: 10px; align-items: baseline; padding: 5px 0; border-top: 1px dashed var(--line); }
.grp:first-child { border-top: 0; }
.grp > b { font: 700 .95rem var(--mono); color: var(--accent); width: 18px; flex: none; }
.online ol { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 8px; }
.ex { display: block; font-style: italic; color: var(--muted); }
.ex::before { content: "“"; } .ex::after { content: "”"; }
.links { display: flex; gap: 14px; flex-wrap: wrap; font: .85rem var(--mono); margin-top: 12px; }
textarea { width: 100%; min-height: 70px; border: 1px solid var(--line); border-radius: 6px; padding: 10px; background: var(--chip); resize: vertical; }

/* result rows: front hooks | word | back hooks | definition | probability */
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding-bottom: 12px; margin-bottom: 4px; border-bottom: 1px solid var(--line); }
.toolbar .count { font: 700 1rem var(--display); margin-right: auto; }
.chips { display: flex; gap: 4px; flex-wrap: wrap; }
select, .field input { border: 1px solid var(--line); background: var(--chip); border-radius: 6px; padding: 7px 9px; min-width: 0; }
.rows { display: flex; flex-direction: column; }
.r { display: grid; grid-template-columns: 4.5em max-content 4.5em minmax(0,1fr) auto; gap: 10px; align-items: baseline; padding: 6px 4px; border-top: 1px solid var(--line); cursor: pointer; }
.r:first-child { border-top: 0; }
.r:hover { background: var(--chip); }
.r .fh { text-align: right; font: .85rem var(--mono); color: var(--link); overflow-wrap: anywhere; }
.r .bh { font: .85rem var(--mono); color: var(--link); overflow-wrap: anywhere; }
.r .wl { font: 700 1rem var(--mono); letter-spacing: .04em; }
.r .wl mark { background: none; color: var(--accent); }
.r .d { color: var(--muted); font-size: .93rem; min-width: 0; }
.r .meta { font: .72rem var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.rows.nodefs .d, .rows.noprob .meta { display: none; }
.rows.nohooks .fh, .rows.nohooks .bh { visibility: hidden; }
@media (max-width: 620px) {
  .r { grid-template-columns: 3.2em max-content minmax(0,1fr); }
  .r .d { grid-column: 2 / -1; } .r .meta { display: none; }
}
.more { margin-top: 12px; }

/* forms */
.fs + .fs { border-top: 1px solid var(--line); margin-top: 16px; padding-top: 14px; }
.form { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px 16px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > label, .field > .flabel { font: 600 .72rem var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.field input { font: 600 .95rem var(--mono); text-transform: uppercase; width: 100%; }
.field input.lc { text-transform: none; font-family: var(--body); }
.field .hint { font: .72rem var(--mono); color: var(--muted); }
.field.wide { grid-column: span 2; }
@media (max-width: 480px) { .field.wide { grid-column: auto; } }
.pair { display: flex; gap: 8px; }
.pair input { width: 50%; }
.check { display: flex; gap: 8px; align-items: center; cursor: pointer; }
.check input { width: auto; margin: 0; }
.field > label.check { font: .95rem var(--body); text-transform: none; letter-spacing: 0; color: var(--ink); }
.help { font: .74rem/1.7 var(--mono); color: var(--muted); }
.help code { background: var(--chip); padding: 1px 4px; border-radius: 3px; color: var(--ink); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 16px; }

/* lists */
.listgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.lcard { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; }
.lcard:hover { border-color: var(--accent); }
.lcard b { font: 700 1rem var(--display); }
.lcard span { color: var(--muted); font-size: .88rem; line-height: 1.4; }
.lcard i { font: normal .74rem var(--mono); color: var(--muted); }
.sect { font: 700 .74rem var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 10px 0 -6px; }
.stem { display: flex; flex-direction: column; gap: 8px; padding: 14px 0; border-top: 1px solid var(--line); }
.stem:first-of-type { border-top: 0; }
.stem .letters { font: 700 1.05rem var(--mono); color: var(--accent); letter-spacing: .12em; }

/* quiz */
.qprompt { font: 800 2.4rem/1.1 var(--mono); letter-spacing: .14em; overflow-wrap: anywhere; }
.qdef { font-size: 1.3rem; }
.qinput { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--chip); font: 600 1.15rem var(--mono); text-transform: uppercase; min-width: 0; }
.progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.progress div { height: 100%; background: var(--good); }
.fb.ok { color: var(--good); font-weight: 600; } .fb.no { color: var(--warn); font-weight: 600; }
/* quiz uses calm colours instead of the red accent */
.quizv .btn.primary { background: var(--link); border-color: var(--link); color: var(--panel); }
.quizv .btn.on { background: var(--link); border-color: var(--link); color: var(--panel); }
.quizv :focus-visible { outline-color: var(--link); }
.w.got { border-color: var(--good); color: var(--good); }
.w.miss { border-color: var(--warn); color: var(--warn); }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }

/* settings */
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.swatch { border: 2px solid var(--line); border-radius: 8px; padding: 0; cursor: pointer; overflow: hidden; text-align: left; background: var(--panel); }
.swatch.on { border-color: var(--accent); }
.swatch .bar { height: 26px; display: flex; align-items: center; gap: 4px; padding: 0 8px; }
.swatch .bar i { width: 14px; height: 14px; border-radius: 3px; display: block; }
.swatch .body { height: 34px; display: flex; align-items: center; gap: 6px; padding: 0 8px; }
.swatch .body i { height: 8px; border-radius: 4px; display: block; }
.swatch span { display: block; padding: 6px 8px; font: 600 .82rem var(--display); }

@media (prefers-reduced-motion: no-preference) {
  .tile { animation: drop .25s ease-out both; }
  @keyframes drop { from { transform: translateY(-6px); opacity: .3; } }
}
@media (max-width: 480px) { .tile { width: 38px; height: 38px; font-size: 1.3rem; } .qprompt { font-size: 1.8rem; } }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <h1>CSW24 Word Study</h1>
      <form class="search" id="form" autocomplete="off">
        <input id="q" placeholder="Word, rack with ? or pattern" spellcheck="false" aria-label="Word, rack or pattern">
        <button class="btn primary" type="submit">Go</button>
        <button class="btn" type="button" id="randBtn" title="Random word">Random</button>
      </form>
    </div>
    <nav class="tabs" id="tabs">
      <a href="#w" data-tab="w">Word</a>
      <a href="#search" data-tab="search">Search</a>
      <a href="#lists" data-tab="lists">Word lists</a>
      <a href="#quiz" data-tab="quiz">Quiz</a>
      <a href="#mine" data-tab="mine">My words</a>
      <a href="#settings" data-tab="settings" class="end">Settings</a>
    </nav>
  </div>
</header>

<main class="wrap" id="view"><p class="small">Loading 280,887 words…</p></main>

<script src="words.js"></script>
<script>
const VALUES = {A:1,B:3,C:3,D:2,E:1,F:4,G:2,H:4,I:1,J:8,K:5,L:1,M:3,N:1,O:1,P:3,Q:10,R:1,S:1,T:1,U:1,V:4,W:4,X:8,Y:4,Z:10};
const AZ = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const alpha = w => w.split("").sort().join("");
const vowels = w => (w.match(/[AEIOU]/g) || []).length;
const nOf = (w, ch) => w.split(ch).length - 1;
const score = w => [...w].reduce((s, c) => s + (VALUES[c] || 0), 0);
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem("csw24:" + k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("csw24:" + k, JSON.stringify(v)); } catch {} }
};

// ---------- settings & themes ----------
const THEMES = {

    dark:  { bg:"#1c1712", panel:"#251e17", ink:"#f1e7d6", muted:"#a99a85", line:"#3a2f24", chip:"#2c241c", head:"#2c2119", "head-ink":"#f1e7d6", field:"#f1e7d6", "field-ink":"#2a2118", tile:"#e8cf96", "tile-edge":"#a7854a", "tile-ink":"#2a1f0e", accent:"#e58a5e", "on-accent":"#1c0f08", link:"#8cc3dc", good:"#7cc576", bad:"#ec8a6a", new:"#c9a0e8", warn:"#f0b45a" } },
  vanilla: { name: "Vanilla and sage",
    light: { bg:"#f5f2e8", panel:"#fffdf6", ink:"#22271f", muted:"#687060", line:"#e0dccb", chip:"#f0ede0", head:"#5f7a5b", "head-ink":"#fbfaf2", field:"#fffdf6", "field-ink":"#22271f", tile:"#f0dcaa", "tile-edge":"#c4a463", "tile-ink":"#2a1f0e", accent:"#8f4a62", "on-accent":"#ffffff", link:"#3b6e8a", good:"#3f7d45", bad:"#b3483d", new:"#7a55b0", warn:"#a66300" },

  parchment: { name: "Parchment and ink",
    light: { bg:"#f3ecdc", panel:"#fbf6ea", ink:"#1f2433", muted:"#6b6555", line:"#dfd4bd", chip:"#efe6d3", head:"#1f2a44", "head-ink":"#f3ecdc", field:"#fbf6ea", "field-ink":"#1f2433", tile:"#ecd39a", "tile-edge":"#bb9853", "tile-ink":"#2a1f0e", accent:"#9c2f2f", "on-accent":"#ffffff", link:"#2c5aa0", good:"#2f7a4b", bad:"#9c2f2f", new:"#6c4fb0", warn:"#a66300" },
    dark:  { bg:"#15171f", panel:"#1d2029", ink:"#ece5d4", muted:"#a39d8c", line:"#2f3340", chip:"#242833", head:"#10131c", "head-ink":"#ece5d4", field:"#ece5d4", "field-ink":"#1f2433", tile:"#e6cd92", "tile-edge":"#a4844a", "tile-ink":"#2a1f0e", accent:"#e07b70", "on-accent":"#1d0b0a", link:"#8db3f0", good:"#6fcb92", bad:"#e07b70", new:"#b9a0f0", warn:"#f0b45a" } },
  blush: { name: "Butter and blush",
    light: { bg:"#fbf3ea", panel:"#fffaf5", ink:"#2b2224", muted:"#7a6a6c", line:"#ecdcd3", chip:"#f7ebe3", head:"#a85d70", "head-ink":"#fff7f2", field:"#fffaf5", "field-ink":"#2b2224", tile:"#f3dca6", "tile-edge":"#c9a462", "tile-ink":"#2a1f0e", accent:"#a8445e", "on-accent":"#ffffff", link:"#3d6c9a", good:"#3a7f55", bad:"#b8424f", new:"#7d4fb8", warn:"#a66300" },

async function fetchOnline(w) {
  const lw = w.toLowerCase();
  const parts = []; let phon = "", audio = "", origin = "";
  try {
    const r = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(lw)}`);
    if (r.ok) for (const ent of await r.json()) {
      phon ||= ent.phonetic || ent.phonetics?.find(p => p.text)?.text || "";
      audio ||= ent.phonetics?.find(p => p.audio)?.audio || "";
      origin ||= ent.origin || "";
      for (const m of ent.meanings || []) for (const d of m.definitions || [])
        parts.push({ pos: m.partOfSpeech, def: d.definition, ex: d.example, syn: [...(d.synonyms || []), ...(m.synonyms || [])] });
    }
  } catch {}
  try {
    const r = await fetch(`https://en.wiktionary.org/api/rest_v1/page/definition/${encodeURIComponent(lw)}`);
    if (r.ok) {
      const data = await r.json();
      const strip = h => { const t = document.createElement("div"); t.innerHTML = h; return t.textContent.trim(); };
      for (const ent of data.en || []) for (const d of ent.definitions || []) {
        const def = strip(d.definition || ""); if (!def) continue;
        const ex = (d.parsedExamples || []).map(x => strip(x.example)).concat((d.examples || []).map(strip)).filter(Boolean)[0];
        if (ex || parts.length < 3) parts.push({ pos: ent.partOfSpeech, def, ex });
      }
    }
  } catch {}
  const b = $("#online");
  if (!b || $("#q").value !== w) return;
  parts.sort((a, b) => (b.ex ? 1 : 0) - (a.ex ? 1 : 0));
  const shown = parts.slice(0, 6);
  const syns = [...new Set(parts.flatMap(p => p.syn || []))].map(s => s.toUpperCase()).filter(s => DICT.has(s)).slice(0, 12);
  b.innerHTML = `<h2 class="lbl">Pronunciation, examples &amp; origin</h2>
    ${phon || audio ? `<div class="row small">${phon ? `<span style="font-size:1rem">${esc(phon)}</span>` : ""}${audio ? `<button class="btn sm" type="button" id="say">▶ Hear it</button>` : ""}</div>` : ""}
    ${shown.length ? `<ol style="margin-top:10px">${shown.map(p => `<li><span class="pos">${esc(p.pos)}</span> ${esc(p.def)}${p.ex ? `<span class="ex">${esc(p.ex)}</span>` : ""}</li>`).join("")}</ol>`
      : `<p class="empty">No online dictionary entry. Many Scrabble words are rare, so lean on the CSW definition and your own memory hook.</p>`}
    ${syns.length ? `<p class="small" style="margin:10px 0 4px">Valid synonyms</p><div class="words">${syns.map(chip).join("")}</div>` : ""}
    ${origin ? `<p class="small" style="margin-top:10px">Origin: ${esc(origin)}</p>` : ""}
    <div class="links">
      <a href="https://en.wiktionary.org/wiki/${encodeURIComponent(lw)}" target="_blank" rel="noopener">Wiktionary</a>
      <a href="https://www.collinsdictionary.com/dictionary/english/${encodeURIComponent(lw)}" target="_blank" rel="noopener">Collins</a>
      <a href="https://www.google.com/search?tbm=isch&q=${encodeURIComponent(lw + " meaning")}" target="_blank" rel="noopener">Images</a>
    </div>`;
  if (audio) $("#say").addEventListener("click", () => new Audio(audio).play().catch(() => {}));
}

// ---------- search ----------
const SEARCH_DEFAULT = { pattern: "", rack: "", mode: "exact", min: "", max: "", starts: "", ends: "", contains: "", incl: "", excl: "", def: "", group: "", top: "" };
let searchState = Object.fromEntries(Object.keys(SEARCH_DEFAULT).map(k => [k, store.get("search", {})[k] ?? SEARCH_DEFAULT[k]]));
if (!G(searchState.group) || G(searchState.group).special) searchState.group = "";

function patternRegex(p) {
  if (!/^[A-Z.?*\[\]^]+$/.test(p)) return null;
  let out = "", inSet = false;
  for (const c of p) {
    if (c === "[") inSet = true; else if (c === "]") inSet = false;
    out += inSet ? (c === "." || c === "?" || c === "*" ? "\\" + c : c) : c === "." || c === "?" ? "[A-Z]" : c === "*" ? "[A-Z]*" : c === "^" ? "" : c;
  }
  try { return new RegExp("^" + out + "$"); } catch { return null; }
}
function runSearch(s) {
  const up = v => (v || "").toUpperCase().replace(/[^A-Z?.*\[\]^]/g, "");
  const letters = v => (v || "").toUpperCase().replace(/[^A-Z]/g, "");
  const pat = up(s.pattern), rack = up(s.rack).replace(/[^A-Z?]/g, "");
  const re = pat ? patternRegex(pat) : null;
  if (pat && !re) return { error: "That pattern isn't valid. Use letters, . or ?, *, and [ABC] sets." };
  const min = +s.min || 0, max = +s.max || 99;
  const starts = letters(s.starts), ends = letters(s.ends), contains = letters(s.contains);
  const incl = counts(letters(s.incl)), excl = new Set(letters(s.excl));
  const def = (s.def || "").trim().toLowerCase();
  const group = s.group ? G(s.group) : null;
  const top = +s.top || 0;
  const rl = rack.replace(/\?/g, ""), rb = rack.length - rl.length, rc = counts(rl);
  const masks = rack && rb ? new Map() : null;
  const pool = rack && s.mode === "exact" ? BYLEN[rack.length] || [] : group ? groupWords(group) : ALL;
  const out = [];
  for (const w of pool) {
    const len = w.length;
    if (len < min || len > max) continue;
    if (starts && !w.startsWith(starts)) continue;
    if (ends && !w.endsWith(ends)) continue;
    if (contains && !w.includes(contains)) continue;
    if (re && !re.test(w)) continue;
    if (excl.size && [...w].some(c => excl.has(c))) continue;
    const e = DICT.get(w);
    if (top && e.p > top) continue;
    if (group && !group.test(w, e)) continue;
    if (Object.keys(incl).length) { const wc = counts(w); if (Object.entries(incl).some(([c, n]) => (wc[c] || 0) < n)) continue; }
    if (rack) {
      if (s.mode === "exact" || s.mode === "build") { if (blanksNeeded(w, rc) > rb) continue; }
      else { const wc = counts(w); if (len < rl.length || Object.entries(rc).some(([c, n]) => (wc[c] || 0) < n)) continue; }
      if (masks && s.mode !== "super") masks.set(w, blankMask(w, rc));
    }
    if (def && !e.d.toLowerCase().includes(def)) continue;
    out.push(w);
  }
  return { words: out, masks };
}

function doSearch() {
  const box = $("#sres"), s = searchState;
  if (!Object.entries(s).some(([k, v]) => k !== "mode" && v)) { box.innerHTML = `<p class="empty">Pick a group or set at least one option.</p>`; return; }
  box.innerHTML = `<p class="small">Searching…</p>`;
  setTimeout(() => {
    const r = runSearch(s);
    if (r.error) { box.innerHTML = `<p class="empty">${esc(r.error)}</p>`; return; }
    const g = s.group && G(s.group);
    const onlyGroup = g && !Object.entries(s).some(([k, v]) => !["mode", "group"].includes(k) && v);
    results(box, r.words, { masks: r.masks, len: onlyGroup ? g.len : 0 });
  }, 10);
}

// ---------- quiz ----------
const MODES = {
  anagram: { name: "Anagram", help: "See the tiles, type every valid word they make." },
  phony: { name: "Valid or phony", help: "Is the word good? Phonies are one letter off real words. Keys: V and P." },
  hooks: { name: "Hooks", help: "Type every front hook and back hook letter." },
  def: { name: "Definition", help: "Read the definition, type the word." },
};
let quizSetup = { source: "stars", mode: "anagram", ...store.get("quizSetup", {}) };
let Q = null;
function quizSources() {
  return [["stars", `My study list (${getStars().length})`], ["missed", `Missed in quizzes (${store.get("missed", []).length})`], ["last", `Last results (${lastResults.length})`]];
}
function sourceWords(src) {
  if (src === "stars") return getStars();
  if (src === "missed") return store.get("missed", []);
  if (src === "last") return lastResults;
  const g = G(src.replace("list:", ""));
  if (!g) return [];
  return g.special === "stems" ? stems(g.n).flatMap(s => s.words) : groupWords(g).filter(w => !g.len || w.length === g.len || !quizSetup.lenOnly);
}
function makePhony(w) {
  const V = "AEIOU", C = "BCDFGHKLMNPRSTVWY";
  for (let t = 0; t < 60; t++) {
    const i = Math.floor(Math.random() * w.length), pool = V.includes(w[i]) ? V : C;
    const p = w.slice(0, i) + pool[Math.floor(Math.random() * pool.length)] + w.slice(i + 1);
    if (p !== w && !DICT.has(p)) return p;
  }
  return null;
}
function buildQuestions(words, mode, n) {
  let src = shuffle(words.filter(w => DICT.has(w)));
  if (mode === "anagram") { const seen = new Set(); src = src.filter(w => { const a = alpha(w); if (seen.has(a)) return false; seen.add(a); return true; }); }
  if (mode === "def") src = src.filter(w => !DICT.get(w).d.startsWith("<"));
  return src.slice(0, n).map(w => {
    if (mode === "phony" && Math.random() * 100 < SET.phony) { const p = makePhony(w); if (p) return { w, show: p, phony: true }; }
    return { w, show: w };
  });
}

  $("#view").innerHTML = `<div><h3 class="title">Quiz</h3><p class="sub">Words you get wrong go to “Missed in quizzes” so you can drill them again.</p></div>
  <div class="card">
    <div class="fs"><h2 class="lbl">Type</h2><div class="seg">${Object.entries(MODES).map(([k, m]) => `<button type="button" class="btn ${k === quizSetup.mode ? "on" : ""}" data-mode="${k}">${m.name}</button>`).join("")}</div>
      <p class="help" style="margin:8px 0 0">${MODES[quizSetup.mode].help}</p></div>
    <div class="fs"><h2 class="lbl">Words</h2><div class="form">
      <div class="field wide"><label for="qsrc">Words from</label><select id="qsrc">
        <optgroup label="Mine">${quizSources().map(([v, t]) => `<option value="${v}" ${v === quizSetup.source ? "selected" : ""}>${esc(t)}</option>`).join("")}</optgroup>
        ${groupOptions(quizSetup.source.replace("list:", ""), true).replace(/value="/g, 'value="list:')}</select></div>
      <div class="field"><label for="qcount">Questions</label><select id="qcount">${[10, 20, 50, 100].map(n => `<option ${n === +SET.qcount ? "selected" : ""}>${n}</option>`).join("")}</select></div>
      <div class="field"><span class="flabel">Length</span><label class="check"><input type="checkbox" id="qlen" ${quizSetup.lenOnly ? "checked" : ""}> Only the list's main length</label></div>
    </div></div>
    <div class="actions"><button class="btn primary" id="qstart">Start quiz</button><span class="small" id="qmsg"></span></div>
  </div>
  ${Q?.done ? summaryHTML() : ""}`;
  $("#view").querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { quizSetup.mode = b.dataset.mode; VIEWS.quiz(); });
  $("#qsrc").onchange = e => quizSetup.source = e.target.value;
  $("#qcount").onchange = e => saveSettings({ qcount: +e.target.value });
  $("#qlen").onchange = e => quizSetup.lenOnly = e.target.checked;
  $("#qstart").onclick = () => {
    store.set("quizSetup", quizSetup);
    const qs = buildQuestions(sourceWords(quizSetup.source), quizSetup.mode, +SET.qcount);
    if (!qs.length) { $("#qmsg").textContent = "No words in that source yet. Star some words or pick a list."; return; }
    Q = { mode: quizSetup.mode, qs, i: 0, right: 0, wrong: [], answered: false, done: false };
    drawQuestion();
  };
  $("#retryMissed")?.addEventListener("click", () => { Q = { mode: Q.mode, qs: buildQuestions(Q.wrong, Q.mode, 999), i: 0, right: 0, wrong: [], answered: false, done: false }; drawQuestion(); });
};
function summaryHTML() {
  return `<div class="card"><h2 class="lbl">Last quiz</h2><p style="margin:0 0 10px"><b style="font:700 1.6rem var(--display)">${Q.right}/${Q.qs.length}</b> correct</p>
    ${Q.wrong.length ? `<p class="small">Missed:</p><div class="words">${Q.wrong.map(chip).join("")}</div><div class="actions"><button class="btn" id="retryMissed">Retry these ${Q.wrong.length}</button></div>` : `<p class="fb ok">Clean sweep.</p>`}</div>`;
}
function record(w, ok) {
  const st = store.get("stats", {}); const s = st[w] || [0, 0]; s[ok ? 0 : 1]++; st[w] = s; store.set("stats", st);
  const m = store.get("missed", []).filter(x => x !== w); if (!ok) m.unshift(w); store.set("missed", m.slice(0, 500));
}
function drawQuestion() {
  const q = Q.qs[Q.i], e = DICT.get(q.w), mode = Q.mode;
  let prompt = "", input = "";
  Q.found = [];
  const nAna = anagrams(q.w).length;
  if (mode === "anagram") { prompt = tilesHTML(alpha(q.w)); input = `<input class="qinput" id="qa" placeholder="${nAna > 1 ? `Type each word (${nAna} to find)` : "Type the word"}"><div class="words" id="found" style="margin-top:8px"></div><p class="small" style="margin:6px 0 0">Correct words are taken as you type. Press Enter to give up and see the answer.</p>`; }
  if (mode === "phony") { prompt = `<div class="qprompt">${q.show}</div>`; input = `<div class="row"><button type="button" class="btn primary" data-ans="valid">Valid (V)</button><button type="button" class="btn" data-ans="phony">Phony (P)</button></div>`; }
  if (mode === "hooks") { prompt = `<div class="qprompt">${q.w}</div>`; input = `<div class="pair"><input class="qinput" id="qf" placeholder="front hooks"><input class="qinput" id="qb" placeholder="back hooks"></div><p class="small" style="margin:6px 0 0">Leave blank if none. Press Enter to check.</p>`; }
  if (mode === "def") { prompt = `<div class="qdef">${esc(e.d)}</div><p class="small" style="margin:0">${q.w.length} letters · <a href="#" id="hint">show tiles</a></p><div id="hintBox"></div>`; input = `<input class="qinput" id="qa" placeholder="The word"><p class="small" style="margin:6px 0 0">The right word is taken as you type. Press Enter to give up.</p>`; }
  $("#view").innerHTML = `<div class="row"><b style="font-family:var(--display)">${MODES[mode].name}</b><span class="small">Question ${Q.i + 1} of ${Q.qs.length} · ${Q.right} right</span><button class="btn sm" id="qquit" style="margin-left:auto">End quiz</button></div>
    <div class="progress"><div style="width:${(Q.i / Q.qs.length) * 100}%"></div></div>
    <div class="card" style="display:flex;flex-direction:column;gap:14px">
      ${mode === "anagram" ? `<p class="small" style="margin:0">${nAna > 1 ? `${nAna} words. Find them all.` : "One word."}</p>` : ""}
      ${prompt}<form id="qform" autocomplete="off">${input}</form><div id="qfb"></div>
    </div>`;
  $("#qquit").onclick = () => { Q.done = true; VIEWS.quiz(); };
  $("#hint")?.addEventListener("click", ev => { ev.preventDefault(); $("#hintBox").innerHTML = tilesHTML(alpha(q.w), true); });
  ($("#qa") || $("#qf"))?.focus();
  // take a correct answer the moment it is typed; with several anagrams, clear the box after each one
  $("#qa")?.addEventListener("input", ev => {
    if (Q.answered) return;
    const v = ev.target.value.toUpperCase().replace(/[^A-Z]/g, "");
    if (mode === "anagram") {
      const want = anagrams(q.w);
      if (want.includes(v) && !Q.found.includes(v)) {
        Q.found.push(v); ev.target.value = "";
        $("#found").innerHTML = Q.found.map(w => `<span class="w got">✓ ${w}</span>`).join("");
        if (Q.found.length === want.length) check();
      }
    } else if (mode === "def" && (v === q.w || (v.length === q.w.length && DICT.get(v)?.d === e.d))) check();
  });
  $("#qform").addEventListener("submit", ev => { ev.preventDefault(); Q.answered ? next() : check(); });
  $("#view").querySelectorAll("[data-ans]").forEach(b => b.onclick = () => { if (!Q.answered) check(b.dataset.ans); });
  document.onkeydown = ev => {
    if (location.hash !== "#quiz" || Q.mode !== "phony" || Q.answered) return;
    if (/^[vp]$/i.test(ev.key)) check(ev.key.toLowerCase() === "v" ? "valid" : "phony");
  };
}
function check(ans) {
  const q = Q.qs[Q.i], e = DICT.get(q.w), mode = Q.mode;
  let ok = false, reveal = "";
  const letters = s => [...new Set((s || "").toUpperCase().replace(/[^A-Z]/g, ""))].sort().join("");
  if (mode === "anagram") {
    const want = anagrams(q.w);
    ok = want.every(a => Q.found.includes(a));
    reveal = want.map(w => `<a class="w ${Q.found.includes(w) ? "got" : "miss"}" href="#w/${w}">${Q.found.includes(w) ? "✓ " : ""}${w}</a>`).join(" ");
    if (!ok && Q.found.length) reveal += `<span class="small">You found ${Q.found.length} of ${want.length}.</span>`;
  } else if (mode === "phony") {
    ok = (ans === "phony") === !!q.phony;
    reveal = q.phony ? `<span>${q.show} is phony. It came from</span> ${chip(q.w)}` : `${chip(q.w)} <span>is valid</span>`;
  } else if (mode === "hooks") {
    ok = letters($("#qf").value) === letters(e.fh) && letters($("#qb").value) === letters(e.bh);
    reveal = `<span class="small">front</span> <b>${e.fh || "none"}</b> <span class="small">back</span> <b>${e.bh || "none"}</b>`;
  } else {
    const g = $("#qa").value.toUpperCase().replace(/[^A-Z]/g, "");
    ok = g === q.w || (g.length === q.w.length && DICT.get(g)?.d === e.d);
    reveal = chip(q.w);
  }
  Q.answered = true;
  if (ok) Q.right++; else Q.wrong.push(q.w);
  record(q.w, ok);
  $("#qfb").innerHTML = `<p class="fb ${ok ? "ok" : "no"}" style="margin:0 0 6px">${ok ? "Correct" : "Not quite"}</p><div class="words" style="align-items:center">${reveal}</div>
    <p class="small" style="margin:8px 0 0">${esc(e.d)}</p><div class="actions"><button class="btn primary" id="qnext">${Q.i + 1 < Q.qs.length ? "Next (Enter)" : "Finish"}</button></div>`;
  $("#qnext").onclick = next;
  $("#qnext").focus();
}
function next() {
  Q.i++; Q.answered = false;
  if (Q.i >= Q.qs.length) { Q.done = true; document.onkeydown = null; VIEWS.quiz(); } else drawQuestion();
}

// ---------- my words ----------
const getStars = () => store.get("stars", []);
const getNotes = () => store.get("notes", {});
function toggleStar(w) { const s = getStars(); const i = s.indexOf(w); i >= 0 ? s.splice(i, 1) : s.unshift(w); store.set("stars", s); return i < 0; }
function addHistory(w) { const h = store.get("hist", []).filter(x => x !== w); h.unshift(w); store.set("hist", h.slice(0, 50)); }

VIEWS.mine = (tab) => {
  tab ||= "stars";
  const notes = getNotes();
  const tabs = { stars: ["Study list", getStars()], missed: ["Missed in quizzes", store.get("missed", [])], notes: ["With memory hooks", Object.keys(notes)], hist: ["Recently viewed", store.get("hist", [])] };
  $("#view").innerHTML = `<div><h3 class="title">My words</h3><p class="sub">Saved in this browser.</p></div>
    <div class="seg">${Object.entries(tabs).map(([k, [n, l]]) => `<a class="btn ${k === tab ? "on" : ""}" href="#mine/${k}">${n} (${l.length})</a>`).join("")}</div>
    ${tab === "stars" ? `<div class="row"><button class="btn sm" id="copyList">Copy list</button><button class="btn sm" id="clearStars">Clear study list</button><span class="small" id="msg"></span></div>` : ""}
    ${tab === "missed" ? `<div class="row"><button class="btn sm" id="clearMissed">Clear missed</button></div>` : ""}
    <div class="card" id="mres"></div>`;
  const words = tabs[tab][1].filter(w => DICT.has(w));
  if (tab === "notes") {
    $("#mres").innerHTML = words.length ? `<div class="rows">${words.map(w => `<div class="r" data-go="${w}"><span class="fh"></span><span class="wl">${w}</span><span class="bh"></span><span class="d">${esc(notes[w])}</span><span></span></div>`).join("")}</div>` : `<p class="empty">Write a memory hook on any word page and it shows up here.</p>`;
  } else if (words.length) results($("#mres"), words);
  else $("#mres").innerHTML = `<p class="empty">${tab === "stars" ? "Press ☆ Star on a word, or Star all on any list." : "Nothing here yet."}</p>`;
  $("#copyList")?.addEventListener("click", () => navigator.clipboard?.writeText(getStars().join("\n")).then(() => $("#msg").textContent = "Copied").catch(() => $("#msg").textContent = "Copy blocked by the browser"));
  confirmBtn($("#clearStars"), () => { store.set("stars", []); VIEWS.mine("stars"); });
  $("#clearMissed")?.addEventListener("click", () => { store.set("missed", []); VIEWS.mine("missed"); });
};
// two-press confirmation for destructive buttons
function confirmBtn(el, fn) {
  if (!el) return;
  let armed = false; const label = el.textContent;
  el.addEventListener("click", () => { if (armed) return fn(); armed = true; el.textContent = "Press again to confirm"; setTimeout(() => { armed = false; el.textContent = label; }, 3000); });
}

// ---------- settings ----------
VIEWS.settings = () => {
  const seg = (key, opts) => `<div class="seg">${opts.map(([v, t]) => `<button type="button" class="btn ${String(SET[key]) === String(v) ? "on" : ""}" data-set="${key}" data-val="${v}">${t}</button>`).join("")}</div>`;
  const chk = (key, label) => `<label class="check"><input type="checkbox" data-chk="${key}" ${SET[key] ? "checked" : ""}> ${label}</label>`;
  const swatch = (id, t) => { const c = t[SET.mode === "dark" || (SET.mode === "auto" && darkMQ.matches) ? "dark" : "light"]; return `<button type="button" class="swatch ${SET.theme === id ? "on" : ""}" data-theme="${id}">
      <div class="bar" style="background:${c.head}"><i style="background:${c.tile}"></i><i style="background:${c.tile}"></i><i style="background:${c.accent}"></i></div>
      <div class="body" style="background:${c.bg}"><i style="width:40%;background:${c.ink}"></i><i style="width:20%;background:${c.link}"></i></div>
      <span>${t.name}</span></button>`; };
  $("#view").innerHTML = `<div><h3 class="title">Settings</h3><p class="sub">Saved in this browser and applied straight away.</p></div>
  <div class="card">
    <div class="fs"><h2 class="lbl">Colour theme</h2><div class="swatches">${Object.entries(THEMES).map(([id, t]) => swatch(id, t)).join("")}</div></div>
    <div class="fs"><h2 class="lbl">Light or dark</h2>${seg("mode", [["auto", "Match my device"], ["light", "Light"], ["dark", "Dark"]])}</div>
    <div class="fs"><h2 class="lbl">Text size</h2>${seg("size", [["sm", "Small"], ["md", "Normal"], ["lg", "Large"]])}</div>
    <div class="fs"><h2 class="lbl">Tiles</h2>${chk("values", "Show letter values on tiles")}</div>
  </div>
  <div class="card">
    <div class="fs"><h2 class="lbl">Word lists and search results</h2><div class="form">
      <div class="field"><label for="setSort">Default sort</label><select id="setSort">${Object.entries(SORTS).map(([k, v]) => `<option value="${k}" ${k === SET.sort ? "selected" : ""}>${v}</option>`).join("")}</select></div>
      <div class="field"><label for="setPage">Words per page</label><select id="setPage">${[100, 300, 1000, 3000].map(n => `<option ${n === +SET.pageSize ? "selected" : ""}>${n}</option>`).join("")}</select></div>
      <div class="field" style="gap:8px"><span class="flabel">Show in each row</span>${chk("defs", "Definitions")}${chk("hooks", "Hooks")}${chk("prob", "Probability rank")}</div>
    </div></div>
    <div class="fs"><h2 class="lbl">Word page</h2>${chk("online", "Look up pronunciation, examples and origin online")}</div>
    <div class="fs"><h2 class="lbl">Quiz</h2><div class="form">
      <div class="field"><label for="setPhony">Phony share in Valid-or-phony</label><select id="setPhony">${[25, 50, 75].map(n => `<option value="${n}" ${n === +SET.phony ? "selected" : ""}>${n}% phonies</option>`).join("")}</select></div>
    </div></div>
    <div class="fs"><h2 class="lbl">Random word</h2><div class="form"><div class="field"><span class="flabel">Length range</span><div class="pair">
      <select id="setRmin" aria-label="Shortest">${range(2, 15).map(n => `<option ${n === +SET.randMin ? "selected" : ""}>${n}</option>`).join("")}</select>
      <select id="setRmax" aria-label="Longest">${range(2, 15).map(n => `<option ${n === +SET.randMax ? "selected" : ""}>${n}</option>`).join("")}</select></div></div></div></div>
  </div>
  <div class="card">
    <div class="fs"><h2 class="lbl">Your data</h2><p class="small" style="margin:0 0 10px">Study list ${getStars().length} · memory hooks ${Object.keys(getNotes()).length} · quiz records ${Object.keys(store.get("stats", {})).length}</p>
      <div class="row"><button class="btn sm" id="clrHist">Clear history</button><button class="btn sm" id="clrStats">Clear quiz records</button><button class="btn sm" id="resetSet">Reset settings</button></div></div>
  </div>`;
  const v = $("#view");
  v.querySelectorAll("[data-theme]").forEach(b => b.onclick = () => { saveSettings({ theme: b.dataset.theme }); VIEWS.settings(); });
  v.querySelectorAll("[data-set]").forEach(b => b.onclick = () => { saveSettings({ [b.dataset.set]: b.dataset.val }); VIEWS.settings(); });
  v.querySelectorAll("[data-chk]").forEach(c => c.onchange = () => saveSettings({ [c.dataset.chk]: c.checked }));
  $("#setSort").onchange = e => saveSettings({ sort: e.target.value });
  $("#setPage").onchange = e => saveSettings({ pageSize: +e.target.value });
  $("#setPhony").onchange = e => saveSettings({ phony: +e.target.value });
  $("#setRmin").onchange = e => saveSettings({ randMin: +e.target.value, randMax: Math.max(+e.target.value, SET.randMax) });
  $("#setRmax").onchange = e => saveSettings({ randMax: +e.target.value, randMin: Math.min(+e.target.value, SET.randMin) });
  confirmBtn($("#clrHist"), () => { store.set("hist", []); VIEWS.settings(); });
  confirmBtn($("#clrStats"), () => { store.set("stats", {}); store.set("missed", []); VIEWS.settings(); });
  confirmBtn($("#resetSet"), () => { SET = { ...SET_DEFAULT }; store.set("settings", SET); applySettings(); VIEWS.settings(); });
};
const range = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => a + i);

// ---------- routing ----------
function route() {
  const [tab, arg] = decodeURIComponent(location.hash.slice(1)).split("/");
  const t = VIEWS[tab] ? tab : "w";
  document.querySelectorAll("#tabs a").forEach(a => a.classList.toggle("on", a.dataset.tab === t));
  if (t !== "quiz") document.onkeydown = null;
  $("#view").classList.toggle("quizv", t === "quiz");
  VIEWS[t](arg);
  window.scrollTo({ top: 0 });
}
window.addEventListener("hashchange", route);
$("#form").addEventListener("submit", ev => {
  ev.preventDefault();
  const q = $("#q").value.toUpperCase().replace(/[^A-Z?.*\[\]^]/g, "");
  if (!q) return;
  const go = patch => { searchState = { ...SEARCH_DEFAULT, ...patch }; store.set("search", searchState); location.hash === "#search" ? VIEWS.search() : location.hash = "search"; };
  if (/[.*\[]/.test(q)) go({ pattern: q });
  else if (q.includes("?")) go({ rack: q, mode: "exact" });
  else location.hash = "w/" + q;
});
$("#randBtn").addEventListener("click", () => {
  const lo = Math.min(SET.randMin, SET.randMax), hi = Math.max(SET.randMin, SET.randMax);
  const pool = BYLEN[lo + Math.floor(Math.random() * (hi - lo + 1))];
  location.hash = "w/" + pool[Math.floor(Math.random() * pool.length)];
});
document.addEventListener("click", ev => {
  const t = ev.target.closest("[data-go]");
  if (t) { ev.preventDefault(); location.hash = "w/" + t.dataset.go; }
});
route();
</script>
</body>
