<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CSW24 Word Study</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CSW24">
<meta name="theme-color" content="#5b3a29" id="themeColor">
<script src="js/paint.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <h1>CSW24 Word Study</h1>
      <form class="search" id="form" autocomplete="off">
        <span class="qwrap"><input id="q" placeholder="Word, letters, ?AE or QU*" spellcheck="false" autocorrect="off" autocapitalize="characters" enterkeyhint="search" aria-label="Word, rack or pattern"><button type="button" class="qx" id="qClear" aria-label="Clear">×</button></span>
        <button class="btn primary" type="submit">Go</button>
        <button class="btn" type="button" id="randBtn" title="Random word">Random</button>
      </form>
    </div>
    <nav class="tabs" id="tabs">
      <a href="#w" data-tab="w">Word</a>
      <a href="#search" data-tab="search">Search</a>
      <a href="#lists" data-tab="study">Study</a>
      <a href="#board" data-tab="board">Board</a>
      <a href="#mine" data-tab="mine"><span class="lg">My words</span><span class="sh">Mine</span></a>
      <a href="#settings" data-tab="settings" class="end">Settings</a>
    </nav>
  </div>
</header>

<main class="wrap" id="view"><p class="small">Loading 280,887 words…</p></main>

<script src="words.js"></script>
<script src="js/engine.js"></script>
<script src="js/start.js"></script>
</body>
</html>
