<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSW24 Word Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: board-green header with search + tabs; one content column; words shown as tiles and hook rows */
:root {
  --bg: #eef1ee;
  --panel: #ffffff;
  --ink: #1d2622;
  --muted: #5f6d66;
  --line: #d5ddd8;
  --board: #1f5c4a;
  --board-ink: #e9f3ee;
  --tile: #f3dfb0;
  --tile-edge: #c9ae72;
  --tile-ink: #2b2213;
  --tws: #c63b4a;
  --dls: #2f7fb5;
  --good: #23824f;
  --bad: #c63b4a;
  --new: #8a5bd1;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "Source Serif 4", Georgia, serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121815; --panel: #1a221e; --ink: #e4ece7; --muted: #94a59c; --line: #2d3a33;
    --board: #173f33; --board-ink: #dcefe5; --tile: #e8d3a0; --tile-edge: #a88d52; --tile-ink: #2b2213;
    --tws: #ef6674; --dls: #8cc4e6; --good: #4cc282; --bad: #ef6674; --new: #b48cf0;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--body); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--dls); }
:focus-visible { outline: 2px solid var(--tws); outline-offset: 2px; }

header { background: var(--board); color: var(--board-ink); padding: 16px 16px 0; position: sticky; top: 0; z-index: 5; }
.wrap { max-width: 1100px; margin: 0 auto; }
.top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.top h1 { font: 800 1.35rem/1 var(--display); margin: 0; letter-spacing: -0.01em; white-space: nowrap; }
form.search { display: flex; gap: 8px; flex: 1 1 320px; min-width: 0; }
form.search input {
  flex: 1; min-width: 0; padding: 9px 12px; border-radius: 6px; border: 0;
  background: var(--board-ink); color: #15211c; font: 600 1.1rem var(--mono); letter-spacing: .08em; text-transform: uppercase;
}
nav.tabs { display: flex; gap: 2px; margin-top: 12px; overflow-x: auto; }
nav.tabs a {
  color: var(--board-ink); text-decoration: none; font: 600 .9rem var(--display); padding: 8px 14px; border-radius: 6px 6px 0 0; opacity: .75; white-space: nowrap;
}
nav.tabs a:hover { opacity: 1; }
nav.tabs a.on { background: var(--bg); color: var(--ink); opacity: 1; }

.btn {
  border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 8px 13px;
  cursor: pointer; font: 600 .88rem var(--display); white-space: nowrap;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--tws); border-color: var(--tws); color: #fff; }
.btn.sm { padding: 4px 9px; font-size: .8rem; }
.btn.on { background: var(--board); color: var(--board-ink); border-color: var(--board); }
header .btn { background: transparent; color: var(--board-ink); border-color: rgba(255,255,255,.35); }
header .btn.primary { background: var(--tws); border-color: var(--tws); color: #fff; }

main.wrap { padding: 22px 16px 70px; display: flex; flex-direction: column; gap: 18px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; min-width: 0; }
h2.lbl, .card > h2 { font: 700 .76rem var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
h3.title { font: 700 1.5rem/1.15 var(--display); margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 4px 0 0; }
.small { font: .78rem/1.5 var(--mono); color: var(--muted); }
.empty { color: var(--muted); font-style: italic; margin: 0; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }

/* word page */
.tilerow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.tiles { display: flex; gap: 4px; flex-wrap: wrap; }
.tile {
  width: 46px; height: 46px; background: var(--tile); color: var(--tile-ink); border-radius: 5px;
  box-shadow: inset 0 -3px 0 var(--tile-edge); position: relative; display: grid; place-items: center;
  font: 700 1.6rem/1 var(--display);
}
.tile sub { position: absolute; right: 4px; bottom: 5px; font: 600 .6rem var(--mono); }
.tiles.mini .tile { width: 30px; height: 30px; font-size: 1.05rem; border-radius: 4px; box-shadow: inset 0 -2px 0 var(--tile-edge); }
.tiles.mini .tile sub { font-size: .45rem; right: 2px; bottom: 2px; }
.hook { display: flex; gap: 3px; flex-wrap: wrap; max-width: 150px; }
.hook button { border: 1px dashed var(--muted); background: none; border-radius: 4px; padding: 2px 6px; cursor: pointer; font: 600 .95rem var(--mono); }
.hook button:hover { border-style: solid; border-color: var(--tws); color: var(--tws); }
.hook.none { font: .78rem var(--mono); color: var(--muted); }
.badges { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
.badge { font: 700 .72rem var(--display); letter-spacing: .06em; text-transform: uppercase; padding: 4px 9px; border-radius: 99px; border: 1.5px solid currentColor; }
.badge.good { color: var(--good); } .badge.bad { color: var(--bad); } .badge.new { color: var(--new); } .badge.plain { color: var(--muted); }
.def { font-size: 1.2rem; margin: 0; }
.pos { font: .8rem var(--mono); color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; }
.stat b { display: block; font: 700 1.25rem var(--display); font-variant-numeric: tabular-nums; }
.stat span { font: .75rem var(--mono); color: var(--muted); }
.words { display: flex; flex-wrap: wrap; gap: 6px; }
.w { font: 600 .9rem var(--mono); padding: 3px 8px; border-radius: 4px; background: var(--bg); border: 1px solid var(--line); cursor: pointer; }
.w:hover { border-color: var(--tws); color: var(--tws); }
.w mark { background: none; color: var(--tws); }
.w sup, .wl sup { color: var(--new); font-size: .65em; }
.grp { display: flex; gap: 10px; align-items: baseline; padding: 5px 0; border-top: 1px dashed var(--line); }
.grp:first-child { border-top: 0; }
.grp > b { font: 700 .95rem var(--mono); color: var(--tws); width: 18px; flex: none; }
.online ol { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 8px; }
.ex { display: block; font-style: italic; color: var(--muted); }
.ex::before { content: "“"; } .ex::after { content: "”"; }
.links { display: flex; gap: 14px; flex-wrap: wrap; font: .85rem var(--mono); margin-top: 12px; }
textarea { width: 100%; min-height: 70px; border: 1px solid var(--line); border-radius: 6px; padding: 10px; background: var(--bg); resize: vertical; }

/* result rows: front hooks | word | back hooks | definition */
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.toolbar .count { font: 700 1rem var(--display); margin-right: auto; }
.chips { display: flex; gap: 4px; flex-wrap: wrap; }
select, .field input { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 7px 9px; }
.rows { display: flex; flex-direction: column; }
.r { display: grid; grid-template-columns: 4.5em max-content 4.5em minmax(0,1fr) auto; gap: 10px; align-items: baseline; padding: 6px 4px; border-top: 1px solid var(--line); cursor: pointer; }
.r:first-child { border-top: 0; }
.r:hover { background: var(--bg); }
.r .fh { text-align: right; font: .85rem var(--mono); color: var(--dls); overflow-wrap: anywhere; }
.r .bh { font: .85rem var(--mono); color: var(--dls); overflow-wrap: anywhere; }
.r .wl { font: 700 1rem var(--mono); letter-spacing: .04em; }
.r .wl mark { background: none; color: var(--tws); }
.r .d { color: var(--muted); font-size: .93rem; min-width: 0; }
.r .meta { font: .72rem var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.rows.nodefs .d { display: none; }
@media (max-width: 620px) {
  .r { grid-template-columns: 3.2em max-content minmax(0,1fr); }
  .r .d { grid-column: 2 / -1; } .r .meta { display: none; }
}
.more { margin-top: 12px; }

/* search form */
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px 16px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font: 600 .74rem var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.field input { font: 600 .95rem var(--mono); text-transform: uppercase; width: 100%; }
.field.wide { grid-column: 1 / -1; }
.field input.lc { text-transform: none; font-family: var(--body); }
.check { display: flex; gap: 6px; align-items: center; font-size: .92rem; }
.help { font: .76rem/1.6 var(--mono); color: var(--muted); }
.help code { background: var(--bg); padding: 1px 4px; border-radius: 3px; color: var(--ink); }

/* lists */
.listgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.lcard { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
.lcard:hover { border-color: var(--tws); }
.lcard b { font: 700 1.05rem var(--display); }
.lcard span { color: var(--muted); font-size: .9rem; }
.lcard i { font: normal .75rem var(--mono); color: var(--dls); margin-top: auto; }
.sect { font: 700 .76rem var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 8px 0 -4px; }
.stem { display: flex; flex-direction: column; gap: 8px; padding: 14px 0; border-top: 1px solid var(--line); }
.stem:first-child { border-top: 0; padding-top: 0; }
.stem .letters { font: 700 1.05rem var(--mono); color: var(--tws); letter-spacing: .12em; }

/* quiz */
.qprompt { font: 800 2.4rem/1.1 var(--mono); letter-spacing: .14em; overflow-wrap: anywhere; }
.qdef { font-size: 1.3rem; }
.qinput { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); font: 600 1.15rem var(--mono); text-transform: uppercase; }
.progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.progress div { height: 100%; background: var(--good); }
.fb.ok { color: var(--good); font-weight: 600; } .fb.no { color: var(--bad); font-weight: 600; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }

@media (prefers-reduced-motion: no-preference) {
  .tile { animation: drop .25s ease-out both; }
  @keyframes drop { from { transform: translateY(-6px); opacity: .3; } }
}
@media (max-width: 480px) { .tile { width: 38px; height: 38px; font-size: 1.3rem; } .qprompt { font-size: 1.8rem; } }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <h1>CSW24 Word Study</h1>
      <form class="search" id="form" autocomplete="off">
        <input id="q" placeholder="Word, rack with ? or pattern" spellcheck="false" aria-label="Word, rack or pattern">
        <button class="btn primary" type="submit">Go</button>
        <button class="btn" type="button" id="randBtn" title="Random word">Random</button>
      </form>
    </div>
    <nav class="tabs" id="tabs">
      <a href="#w" data-tab="w">Word</a>
      <a href="#search" data-tab="search">Search</a>
      <a href="#lists" data-tab="lists">Word lists</a>
      <a href="#quiz" data-tab="quiz">Quiz</a>
      <a href="#mine" data-tab="mine">My words</a>
    </nav>
  </div>
</header>

<main class="wrap" id="view"><p class="small">Loading 280,887 words…</p></main>

<script src="words.js"></script>
<script>
const VALUES = {A:1,B:3,C:3,D:2,E:1,F:4,G:2,H:4,I:1,J:8,K:5,L:1,M:3,N:1,O:1,P:3,Q:10,R:1,S:1,T:1,U:1,V:4,W:4,X:8,Y:4,Z:10};
const AZ = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const alpha = w => w.split("").sort().join("");
const vowels = w => (w.match(/[AEIOU]/g) || []).length;
const score = w => [...w].reduce((s, c) => s + (VALUES[c] || 0), 0);
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem("csw24:" + k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("csw24:" + k, JSON.stringify(v)); } catch {} }
};

// ---------- lexicon ----------
const DICT = new Map(), ANA = new Map(), BYLEN = {};
if (!window.CSW_TSV) {
  $("#view").innerHTML = `<div class="card"><h3 class="title">Word data missing</h3><p>Run <code>python3 build.py</code> in this folder to create <code>words.js</code> from your Zyzzyva CSW24 lexicon, then reload.</p></div>`;
  throw new Error("words.js not found");
}
for (const line of window.CSW_TSV.split("\n")) {
  const [w, d, fh, bh, sym, p, pl] = line.split("\t");
  DICT.set(w, { d, fh, bh, n: sym === "+", p: +p, pl: +pl });
  const a = alpha(w);
  (ANA.get(a) || ANA.set(a, []).get(a)).push(w);
  (BYLEN[w.length] ||= []).push(w);
}
window.CSW_TSV = null;
const ALL = [...DICT.keys()];

const anagrams = w => ANA.get(alpha(w)) || [];
function plusOne(w) {
  const out = [];
  for (const L of AZ) { const g = ANA.get(alpha(w + L)); if (g) out.push([L, g]); }
  return out;
}
function minusOne(w) {
  const seen = new Set(), out = [];
  for (let i = 0; i < w.length; i++) {
    if (seen.has(w[i])) continue; seen.add(w[i]);
    const g = ANA.get(alpha(w.slice(0, i) + w.slice(i + 1)));
    if (g) out.push([w[i], g]);
  }
  return out;
}
// letter counts for rack maths
function counts(s) { const c = {}; for (const ch of s) c[ch] = (c[ch] || 0) + 1; return c; }
// how many blanks w needs from rack counts rc (Infinity if impossible)
function blanksNeeded(w, rc) {
  const need = {}; let b = 0;
  for (const ch of w) { need[ch] = (need[ch] || 0) + 1; if (need[ch] > (rc[ch] || 0)) b++; }
  return b;
}
// which letters of w came from blanks (for highlighting)
function blankMask(w, rc) {
  const left = { ...rc };
  return [...w].map(ch => { if (left[ch] > 0) { left[ch]--; return false; } return true; });
}

// ---------- shared rendering ----------
function defHTML(d) {
  return d.split(" / ").map(part => {
    const m = part.match(/^(.*?)(\s*\[[^\]]+\])?$/);
    const body = esc(m[1]).replace(/\b[A-Z]{2,15}\b/g, x => DICT.has(x) ? `<a href="#w/${x}">${x}</a>` : x);
    return `<span>${body}${m[2] ? ` <span class="pos">${esc(m[2].trim())}</span>` : ""}</span>`;
  }).join("<br>");
}
function chip(w) {
  const e = DICT.get(w);
  return `<a class="w" href="#w/${w}" title="${esc(e?.d)}" style="text-decoration:none;color:inherit">${w}${e?.n ? "<sup>+</sup>" : ""}</a>`;
}
function tilesHTML(w, mini, mask) {
  return `<div class="tiles${mini ? " mini" : ""}">${[...w].map((c, i) => `<div class="tile" style="animation-delay:${i * 25}ms${mask?.[i] ? ";opacity:.55" : ""}">${c}<sub>${mask?.[i] ? 0 : VALUES[c]}</sub></div>`).join("")}</div>`;
}

// Results component: toolbar (count, length chips, sort, defs toggle, actions) + rows + paging
const SORTS = { prob: "Probability", alpha: "A–Z", len: "Length", score: "Points", play: "Playability" };
function results(el, words, opts = {}) {
  const st = { len: opts.len || 0, sort: opts.sort || store.get("sort", "prob"), defs: store.get("defs", true), shown: 300 };
  const lens = [...new Set(words.map(w => w.length))].sort((a, b) => a - b);
  if (st.len && !lens.includes(st.len)) st.len = 0;
  const sorters = {
    prob: (a, b) => a.length - b.length || DICT.get(a).p - DICT.get(b).p,
    alpha: (a, b) => a < b ? -1 : 1,
    len: (a, b) => a.length - b.length || (a < b ? -1 : 1),
    score: (a, b) => score(b) - score(a) || (a < b ? -1 : 1),
    play: (a, b) => DICT.get(a).pl - DICT.get(b).pl,
  };
  function current() {
    const list = st.len ? words.filter(w => w.length === st.len) : [...words];
    return opts.keepOrder && st.sort === "prob" ? list : list.sort(sorters[st.sort]);
  }
  function draw() {
    const list = current();
    lastResults = list;
    el.innerHTML = `
      <div class="toolbar">
        <span class="count">${list.length.toLocaleString()} word${list.length === 1 ? "" : "s"}</span>
        ${lens.length > 1 ? `<div class="chips"><button class="btn sm ${st.len ? "" : "on"}" data-len="0">All</button>${lens.map(n => `<button class="btn sm ${st.len === n ? "on" : ""}" data-len="${n}">${n}</button>`).join("")}</div>` : ""}
        <select id="sortSel" aria-label="Sort">${Object.entries(SORTS).map(([k, v]) => `<option value="${k}" ${k === st.sort ? "selected" : ""}>${v}</option>`).join("")}</select>
        <label class="check"><input type="checkbox" id="defChk" ${st.defs ? "checked" : ""}> Definitions</label>
        <button class="btn sm" id="quizThese">Quiz these</button>
        <button class="btn sm" id="starAll">Star all</button>
      </div>
      ${list.length ? `<div class="rows ${st.defs ? "" : "nodefs"}">${list.slice(0, st.shown).map(w => rowHTML(w, opts.masks?.get(w))).join("")}</div>` : `<p class="empty">No words match.</p>`}
      ${list.length > st.shown ? `<button class="btn more" id="moreBtn">Show ${Math.min(300, list.length - st.shown)} more</button>` : ""}`;
    el.querySelectorAll("[data-len]").forEach(b => b.onclick = () => { st.len = +b.dataset.len; st.shown = 300; draw(); });
    el.querySelector("#sortSel").onchange = e => { st.sort = e.target.value; store.set("sort", st.sort); draw(); };
    el.querySelector("#defChk").onchange = e => { st.defs = e.target.checked; store.set("defs", st.defs); el.querySelector(".rows")?.classList.toggle("nodefs", !st.defs); };
    el.querySelector("#moreBtn")?.addEventListener("click", () => { st.shown += 300; draw(); });
    el.querySelector("#quizThese").onclick = () => { quizSetup = { ...quizSetup, source: "last" }; location.hash = "quiz"; };
    el.querySelector("#starAll").onclick = e => { const s = getStars(); const add = list.filter(w => !s.includes(w)); store.set("stars", [...add, ...s]); e.target.textContent = `Starred ${add.length}`; };
  }
  draw();
}
function rowHTML(w, mask) {
  const e = DICT.get(w);
  const label = mask ? [...w].map((c, i) => mask[i] ? `<mark>${c.toLowerCase()}</mark>` : c).join("") : w;
  return `<div class="r" data-go="${w}"><span class="fh">${e.fh}</span><span class="wl">${label}${e.n ? "<sup>+</sup>" : ""}</span><span class="bh">${e.bh}</span><span class="d">${esc(e.d)}</span><span class="meta">#${e.p.toLocaleString()}</span></div>`;
}
let lastResults = [];

// ---------- views ----------
const VIEWS = {};

VIEWS.w = (arg) => {
  const w = (arg || store.get("hist", [])[0] || "QI").toUpperCase().replace(/[^A-Z]/g, "");
  if (!w) return;
  $("#q").value = w;
  const e = DICT.get(w), valid = !!e;
  if (valid) addHistory(w);
  const ana = anagrams(w).filter(x => x !== w);
  const plus = plusOne(w), minus = minusOne(w);
  const plusN = plus.reduce((s, g) => s + g[1].length, 0), minusN = minus.reduce((s, g) => s + g[1].length, 0);
  const starred = getStars().includes(w);
  const hooks = (s, side) => s
    ? `<div class="hook">${[...s].map(h => `<button type="button" data-go="${side === "f" ? h.toUpperCase() + w : w + h.toUpperCase()}">${h}</button>`).join("")}</div>`
    : `<div class="hook none">no ${side === "f" ? "front" : "back"}<br>hooks</div>`;
  const s = store.get("stats", {})[w];
  let html = `<div class="card">
    <div class="tilerow">${valid ? hooks(e.fh, "f") : ""}${tilesHTML(w)}${valid ? hooks(e.bh, "b") : ""}</div>
    <div class="badges">
      ${valid ? `<span class="badge good">Valid in CSW24</span>` : `<span class="badge bad">Not valid · phony</span>`}
      ${e?.n ? `<span class="badge new">New in CSW24</span>` : ""}
      <span class="badge plain">${score(w)} pts</span>
      ${s ? `<span class="badge plain">Quiz ${s[0]}✓ ${s[1]}✗</span>` : ""}
      ${valid ? `<button class="btn sm ${starred ? "on" : ""}" id="starBtn" style="margin-left:auto">${starred ? "★ Starred" : "☆ Star"}</button>` : ""}

async function fetchOnline(w) {
  const lw = w.toLowerCase();
  const parts = []; let phon = "", audio = "", origin = "";
  try {
    const r = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(lw)}`);
    if (r.ok) for (const ent of await r.json()) {
      phon ||= ent.phonetic || ent.phonetics?.find(p => p.text)?.text || "";
      audio ||= ent.phonetics?.find(p => p.audio)?.audio || "";
      origin ||= ent.origin || "";
      for (const m of ent.meanings || []) for (const d of m.definitions || [])
        parts.push({ pos: m.partOfSpeech, def: d.definition, ex: d.example, syn: [...(d.synonyms || []), ...(m.synonyms || [])] });
    }
  } catch {}
  try {
    const r = await fetch(`https://en.wiktionary.org/api/rest_v1/page/definition/${encodeURIComponent(lw)}`);
    if (r.ok) {
      const data = await r.json();
      const strip = h => { const t = document.createElement("div"); t.innerHTML = h; return t.textContent.trim(); };
      for (const ent of data.en || []) for (const d of ent.definitions || []) {
        const def = strip(d.definition || ""); if (!def) continue;
        const ex = (d.parsedExamples || []).map(x => strip(x.example)).concat((d.examples || []).map(strip)).filter(Boolean)[0];
        if (ex || parts.length < 3) parts.push({ pos: ent.partOfSpeech, def, ex });
      }
    }
  } catch {}
  const b = $("#online");
  if (!b || $("#q").value !== w) return;
  parts.sort((a, b) => (b.ex ? 1 : 0) - (a.ex ? 1 : 0));
  const shown = parts.slice(0, 6);
  const syns = [...new Set(parts.flatMap(p => p.syn || []))].map(s => s.toUpperCase()).filter(s => DICT.has(s)).slice(0, 12);
  b.innerHTML = `<h2>Pronunciation, examples &amp; origin</h2>
    ${phon || audio ? `<div class="row small">${phon ? `<span style="font-size:1rem">${esc(phon)}</span>` : ""}${audio ? `<button class="btn sm" type="button" id="say">▶ Hear it</button>` : ""}</div>` : ""}
    ${shown.length ? `<ol style="margin-top:10px">${shown.map(p => `<li><span class="pos">${esc(p.pos)}</span> ${esc(p.def)}${p.ex ? `<span class="ex">${esc(p.ex)}</span>` : ""}</li>`).join("")}</ol>`
      : `<p class="empty">No online dictionary entry. Many Scrabble words are rare, so lean on the CSW definition and your own memory hook.</p>`}
    ${syns.length ? `<p class="small" style="margin-top:10px">Valid synonyms: </p><div class="words">${syns.map(chip).join("")}</div>` : ""}
    ${origin ? `<p class="small" style="margin-top:10px">Origin: ${esc(origin)}</p>` : ""}
    <div class="links">
      <a href="https://en.wiktionary.org/wiki/${encodeURIComponent(lw)}" target="_blank" rel="noopener">Wiktionary</a>
      <a href="https://www.collinsdictionary.com/dictionary/english/${encodeURIComponent(lw)}" target="_blank" rel="noopener">Collins</a>
      <a href="https://www.google.com/search?tbm=isch&q=${encodeURIComponent(lw + " meaning")}" target="_blank" rel="noopener">Images</a>
    </div>`;
  if (audio) $("#say").addEventListener("click", () => new Audio(audio).play().catch(() => {}));
}

// ---------- search ----------
const SEARCH_DEFAULT = { pattern: "", rack: "", mode: "exact", min: "", max: "", starts: "", ends: "", contains: "", incl: "", excl: "", def: "", newOnly: false, power: false };
let searchState = { ...SEARCH_DEFAULT, ...store.get("search", {}) };

function patternRegex(p) {
  // letters, . or ? = any letter, * = any run, [ABC] / [^ABC] = letter sets
  if (!/^[A-Z.?*\[\]^]+$/.test(p)) return null;
  try { return new RegExp("^" + p.replace(/[.?]/g, "[A-Z]").replace(/\*/g, "[A-Z]*") + "$"); } catch { return null; }
}
function runSearch(s) {
  const up = v => (v || "").toUpperCase().replace(/[^A-Z?.*\[\]^]/g, "");
  const pat = up(s.pattern), rack = up(s.rack).replace(/[^A-Z?]/g, "");
  const re = pat ? patternRegex(pat) : null;
  if (pat && !re) return { error: "That pattern isn't valid. Use letters, . or ?, *, and [ABC] sets." };
  const min = +s.min || 0, max = +s.max || 99;
  const starts = up(s.starts).replace(/[^A-Z]/g, ""), ends = up(s.ends).replace(/[^A-Z]/g, ""), contains = up(s.contains).replace(/[^A-Z]/g, "");
  const incl = counts(up(s.incl).replace(/[^A-Z]/g, "")), excl = new Set(up(s.excl).replace(/[^A-Z]/g, ""));
  const def = (s.def || "").trim().toLowerCase();
  const rl = rack.replace(/\?/g, ""), rb = rack.length - rl.length, rc = counts(rl);
  const masks = rack && rb ? new Map() : null;
  let pool = ALL;
  if (rack && s.mode === "exact") pool = BYLEN[rack.length] || [];
  const out = [];
  for (const w of pool) {
    const L = w.length;
    if (L < min || L > max) continue;
    if (starts && !w.startsWith(starts)) continue;
    if (ends && !w.endsWith(ends)) continue;
    if (contains && !w.includes(contains)) continue;
    if (re && !re.test(w)) continue;
    if (excl.size && [...w].some(c => excl.has(c))) continue;
    if (s.power && !/[JQXZ]/.test(w)) continue;
    const e = DICT.get(w);
    if (s.newOnly && !e.n) continue;
    if (Object.keys(incl).length) { const wc = counts(w); if (Object.entries(incl).some(([c, n]) => (wc[c] || 0) < n)) continue; }
    if (rack) {
      if (s.mode === "exact" || s.mode === "build") { if (blanksNeeded(w, rc) > rb) continue; }
      else if (s.mode === "super") { const wc = counts(w); if (Object.entries(rc).some(([c, n]) => (wc[c] || 0) < n) || L < rack.length) continue; }
      if (masks && s.mode !== "super") masks.set(w, blankMask(w, rc));
    }
    if (def && !e.d.toLowerCase().includes(def)) continue;
    out.push(w);
  }
  return { words: out, masks };
}

  if (Object.entries(searchState).some(([k, v]) => v && v !== SEARCH_DEFAULT[k])) doSearch();

function doSearch() {
  const box = $("#sres");

  }, 10);

const listCache = {};
const listWords = l => listCache[l.id] ||= (l.special === "stems" ? stems(l.n).map(s => s.stem) : l.words());

function stems(n) {
  if (listCache["stemdata" + n]) return listCache["stemdata" + n];
  const m = new Map();
  for (const w of BYLEN[n + 1]) {
    const a = alpha(w), seen = new Set();
    for (let i = 0; i < a.length; i++) {
      if (seen.has(a[i])) continue; seen.add(a[i]);
      const s = a.slice(0, i) + a.slice(i + 1);
      (m.get(s) || m.set(s, new Set()).get(s)).add(w);
    }
  }
  return listCache["stemdata" + n] = [...m].map(([stem, set]) => ({ stem, n: set.size, words: [...set] })).sort((a, b) => b.n - a.n).slice(0, 150);
}

const MODES = {

  phony: { name: "Valid or phony", help: "Is the word good? Phonies are one letter off real words." },
  hooks: { name: "Hooks", help: "Type every front hook and back hook letter." },
  def: { name: "Definition", help: "Read the definition, type the word." },
};
let quizSetup = { source: "stars", mode: "anagram", count: 20, ...store.get("quizSetup", {}) };
let Q = null;

function quizSources() {
  return [["stars", `My study list (${getStars().length})`], ["missed", `Missed in quizzes (${store.get("missed", []).length})`], ["last", `Last results (${lastResults.length})`],
    ...LISTS.filter(l => l.id).map(l => ["list:" + l.id, l.name])];
}
function sourceWords(src) {
  if (src === "stars") return getStars();
  if (src === "missed") return store.get("missed", []);
  if (src === "last") return lastResults;
  const l = LISTS.find(x => "list:" + x.id === src);
  if (!l) return [];
  return l.special === "stems" ? stems(l.n).flatMap(s => s.words) : listWords(l);
}
function makePhony(w) {
  const V = "AEIOU", C = "BCDFGHKLMNPRSTVWY";
  for (let t = 0; t < 60; t++) {
    const i = Math.floor(Math.random() * w.length), pool = V.includes(w[i]) ? V : C;
    const p = w.slice(0, i) + pool[Math.floor(Math.random() * pool.length)] + w.slice(i + 1);
    if (p !== w && !DICT.has(p)) return p;
  }
  return null;
}
function buildQuestions(words, mode, n) {
  let src = shuffle(words.filter(w => DICT.has(w)));
  if (mode === "anagram") { const seen = new Set(); src = src.filter(w => { const a = alpha(w); if (seen.has(a)) return false; seen.add(a); return true; }); }
  if (mode === "def") src = src.filter(w => !DICT.get(w).d.startsWith("<"));
  return src.slice(0, n).map(w => {
    if (mode === "phony" && Math.random() < 0.5) { const p = makePhony(w); if (p) return { w, show: p, phony: true }; }
    return { w, show: w };
  });
}

  $("#view").innerHTML = `<div><h3 class="title">Quiz</h3><p class="sub">Words you get wrong go to “Missed in quizzes” so you can drill them again.</p></div>
  <div class="card"><div class="form">
    <div class="field"><label for="qsrc">Words from</label><select id="qsrc">${srcs.map(([v, t]) => `<option value="${v}" ${v === quizSetup.source ? "selected" : ""}>${esc(t)}</option>`).join("")}</select></div>
    <div class="field"><label for="qcount">Questions</label><select id="qcount">${[10, 20, 50, 100].map(n => `<option ${n === +quizSetup.count ? "selected" : ""}>${n}</option>`).join("")}</select></div>
    <div class="field wide"><label>Type</label><div class="seg">${Object.entries(MODES).map(([k, m]) => `<button type="button" class="btn ${k === quizSetup.mode ? "on" : ""}" data-mode="${k}">${m.name}</button>`).join("")}</div><span class="help" id="modeHelp">${MODES[quizSetup.mode].help}</span></div>
  </div>
  <div class="row" style="margin-top:14px"><button class="btn primary" id="qstart">Start quiz</button><span class="small" id="qmsg"></span></div></div>
  ${Q?.done ? summaryHTML() : ""}`;
  $("#view").querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { quizSetup.mode = b.dataset.mode; VIEWS.quiz(); });
  $("#qsrc").onchange = e => quizSetup.source = e.target.value;
  $("#qcount").onchange = e => quizSetup.count = +e.target.value;
  $("#qstart").onclick = () => {
    store.set("quizSetup", quizSetup);
    const qs = buildQuestions(sourceWords(quizSetup.source), quizSetup.mode, +quizSetup.count);
    if (!qs.length) { $("#qmsg").textContent = "No words in that source yet. Star some words or pick a list."; return; }
    Q = { mode: quizSetup.mode, qs, i: 0, right: 0, wrong: [], answered: false, done: false };
    drawQuestion();
  };
  $("#retryMissed")?.addEventListener("click", () => { Q = { mode: Q.mode, qs: buildQuestions(Q.wrong, Q.mode, 999), i: 0, right: 0, wrong: [], answered: false, done: false }; drawQuestion(); });
};
function summaryHTML() {
  return `<div class="card"><h2>Last quiz</h2><p style="margin:0 0 10px"><b style="font:700 1.6rem var(--display)">${Q.right}/${Q.qs.length}</b> correct</p>
    ${Q.wrong.length ? `<p class="small">Missed:</p><div class="words">${Q.wrong.map(chip).join("")}</div><div class="row" style="margin-top:12px"><button class="btn" id="retryMissed">Retry these ${Q.wrong.length}</button></div>` : `<p class="fb ok">Clean sweep.</p>`}</div>`;
}
function record(w, ok) {
  const st = store.get("stats", {}); const s = st[w] || [0, 0]; s[ok ? 0 : 1]++; st[w] = s; store.set("stats", st);
  let m = store.get("missed", []).filter(x => x !== w); if (!ok) m.unshift(w); store.set("missed", m.slice(0, 500));
}
function drawQuestion() {
  const q = Q.qs[Q.i], e = DICT.get(q.w), mode = Q.mode;
  let prompt = "", input = "";
  if (mode === "anagram") { prompt = tilesHTML(alpha(q.w)); input = `<input class="qinput" id="qa" placeholder="Type the word(s), space between">`; }
  if (mode === "phony") { prompt = `<div class="qprompt">${q.show}</div>`; input = `<div class="row"><button class="btn primary" data-ans="valid">Valid (V)</button><button class="btn" data-ans="phony">Phony (P)</button></div>`; }
  if (mode === "hooks") { prompt = `<div class="qprompt">${q.w}</div>`; input = `<div class="row" style="flex-wrap:nowrap"><input class="qinput" id="qf" placeholder="front hooks"><input class="qinput" id="qb" placeholder="back hooks"></div><p class="small" style="margin:6px 0 0">Leave blank if none. Press Enter to check.</p>`; }
  if (mode === "def") { prompt = `<div class="qdef">${esc(e.d)}</div><p class="small">${q.w.length} letters · <a href="#" id="hint">show tiles</a></p><div id="hintBox"></div>`; input = `<input class="qinput" id="qa" placeholder="The word">`; }
  $("#view").innerHTML = `<div class="row"><b style="font-family:var(--display)">${MODES[mode].name}</b><span class="small">Question ${Q.i + 1} of ${Q.qs.length} · ${Q.right} right</span><button class="btn sm" id="qquit" style="margin-left:auto">End quiz</button></div>
    <div class="progress"><div style="width:${(Q.i / Q.qs.length) * 100}%"></div></div>
    <div class="card" style="display:flex;flex-direction:column;gap:14px">
      ${mode === "anagram" ? `<p class="small" style="margin:0">${anagrams(q.w).length > 1 ? "More than one word. Find them all." : "One word."}</p>` : ""}
      ${prompt}<form id="qform" autocomplete="off">${input}</form><div id="qfb"></div>
    </div>`;
  $("#qquit").onclick = () => { Q.done = true; VIEWS.quiz(); };
  $("#hint")?.addEventListener("click", ev => { ev.preventDefault(); $("#hintBox").innerHTML = tilesHTML(alpha(q.w), true); });
  const first = $("#qa") || $("#qf"); first?.focus();
  $("#qform").addEventListener("submit", ev => { ev.preventDefault(); Q.answered ? next() : check(); });
  $("#view").querySelectorAll("[data-ans]").forEach(b => b.onclick = () => Q.answered ? next() : check(b.dataset.ans));
  document.onkeydown = ev => {
    if (location.hash !== "#quiz" || Q.mode !== "phony") return;
    if (!Q.answered && /^[vp]$/i.test(ev.key)) check(ev.key.toLowerCase() === "v" ? "valid" : "phony");
  };
}
function check(ans) {
  const q = Q.qs[Q.i], e = DICT.get(q.w), mode = Q.mode;
  let ok = false, reveal = "";
  const letters = s => [...new Set((s || "").toUpperCase().replace(/[^A-Z]/g, ""))].sort().join("");
  if (mode === "anagram") {
    const want = anagrams(q.w), got = new Set($("#qa").value.toUpperCase().split(/[^A-Z]+/).filter(Boolean));
    ok = want.every(a => got.has(a)) && [...got].every(g => want.includes(g));
    reveal = want.map(chip).join(" ");
  } else if (mode === "phony") {
    ok = (ans === "phony") === !!q.phony;
    reveal = q.phony ? `${q.show} is phony. It came from ${chip(q.w)}` : `${chip(q.w)} is valid`;
  } else if (mode === "hooks") {
    ok = letters($("#qf").value) === letters(e.fh) && letters($("#qb").value) === letters(e.bh);
    reveal = `<span class="small">front</span> <b>${e.fh || "none"}</b> · <span class="small">back</span> <b>${e.bh || "none"}</b>`;
  } else {
    const g = $("#qa").value.toUpperCase().replace(/[^A-Z]/g, "");
    ok = g === q.w || (DICT.has(g) && DICT.get(g).d === e.d);
    reveal = chip(q.w);
  }
  Q.answered = true;
  if (ok) Q.right++; else Q.wrong.push(q.w);
  record(q.w, ok);
  $("#qfb").innerHTML = `<p class="fb ${ok ? "ok" : "no"}" style="margin:0 0 6px">${ok ? "Correct" : "Not quite"}</p><div class="words" style="align-items:center">${reveal}</div>
    <p class="small" style="margin:8px 0 0">${esc(e.d)}</p><div class="row" style="margin-top:10px"><button class="btn primary" id="qnext">${Q.i + 1 < Q.qs.length ? "Next (Enter)" : "Finish"}</button></div>`;
  $("#qnext").onclick = next;
  $("#qnext").focus();
}
function next() {
  Q.i++; Q.answered = false;
  if (Q.i >= Q.qs.length) { Q.done = true; document.onkeydown = null; VIEWS.quiz(); } else drawQuestion();
}

// ---------- my words ----------
const getStars = () => store.get("stars", []);
const getNotes = () => store.get("notes", {});
function toggleStar(w) { const s = getStars(); const i = s.indexOf(w); i >= 0 ? s.splice(i, 1) : s.unshift(w); store.set("stars", s); return i < 0; }
function addHistory(w) { const h = store.get("hist", []).filter(x => x !== w); h.unshift(w); store.set("hist", h.slice(0, 50)); }

VIEWS.mine = (tab) => {
  tab ||= "stars";
  const notes = getNotes();
  const tabs = { stars: ["Study list", getStars()], missed: ["Missed in quizzes", store.get("missed", [])], notes: ["With memory hooks", Object.keys(notes)], hist: ["Recently viewed", store.get("hist", [])] };
  $("#view").innerHTML = `<div><h3 class="title">My words</h3><p class="sub">Saved in this browser.</p></div>
    <div class="seg">${Object.entries(tabs).map(([k, [n, l]]) => `<a class="btn ${k === tab ? "on" : ""}" href="#mine/${k}">${n} (${l.length})</a>`).join("")}</div>
    ${tab === "stars" ? `<div class="row"><button class="btn sm" id="copyList">Copy list</button><button class="btn sm" id="clearStars">Clear study list</button><span class="small" id="msg"></span></div>` : ""}
    ${tab === "missed" ? `<div class="row"><button class="btn sm" id="clearMissed">Clear missed</button></div>` : ""}
    <div class="card" id="mres"></div>`;
  const words = tabs[tab][1].filter(w => DICT.has(w));
  if (tab === "notes") {
    $("#mres").innerHTML = words.length ? `<div class="rows">${words.map(w => `<div class="r" data-go="${w}"><span class="fh"></span><span class="wl">${w}</span><span class="bh"></span><span class="d">${esc(notes[w])}</span><span></span></div>`).join("")}</div>` : `<p class="empty">Write a memory hook on any word page and it shows up here.</p>`;
  } else if (words.length) results($("#mres"), words);
  else $("#mres").innerHTML = `<p class="empty">${tab === "stars" ? "Press ☆ Star on a word, or Star all on any list." : "Nothing here yet."}</p>`;
  $("#copyList")?.addEventListener("click", () => navigator.clipboard?.writeText(getStars().join("\n")).then(() => $("#msg").textContent = "Copied").catch(() => $("#msg").textContent = "Copy blocked by the browser"));
  let armed = false;
  $("#clearStars")?.addEventListener("click", ev => { if (!armed) { armed = true; ev.target.textContent = "Press again to clear"; return; } store.set("stars", []); VIEWS.mine("stars"); });
  $("#clearMissed")?.addEventListener("click", () => { store.set("missed", []); VIEWS.mine("missed"); });
};

// ---------- routing ----------
function route() {
  const [tab, arg] = decodeURIComponent(location.hash.slice(1)).split("/");
  const t = VIEWS[tab] ? tab : "w";
  document.querySelectorAll("#tabs a").forEach(a => a.classList.toggle("on", a.dataset.tab === t));
  if (t !== "quiz") document.onkeydown = null;
  VIEWS[t](arg);
  window.scrollTo({ top: 0 });
}
window.addEventListener("hashchange", route);
$("#form").addEventListener("submit", ev => {
  ev.preventDefault();
  const q = $("#q").value.toUpperCase().replace(/[^A-Z?.*\[\]^]/g, "");
  if (!q) return;
  if (/[.*\[]/.test(q)) { searchState = { ...SEARCH_DEFAULT, pattern: q }; store.set("search", searchState); location.hash === "#search" ? VIEWS.search() : location.hash = "search"; }
  else if (q.includes("?")) { searchState = { ...SEARCH_DEFAULT, rack: q, mode: "exact" }; store.set("search", searchState); location.hash === "#search" ? VIEWS.search() : location.hash = "search"; }
  else location.hash = "w/" + q;
});
$("#randBtn").addEventListener("click", () => {
  const pool = BYLEN[2 + Math.floor(Math.random() * 7)];
  location.hash = "w/" + pool[Math.floor(Math.random() * pool.length)];
});
document.addEventListener("click", ev => {
  const t = ev.target.closest("[data-go]");
  if (t) { ev.preventDefault(); location.hash = "w/" + t.dataset.go; }
});
route();
</script>
</body>
